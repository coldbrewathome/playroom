<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBF3E4">
<title>Playroom</title>
<style>
  :root{--ink:#22242c;--paper:#FBF3E4;--quiz:#F97B22}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60vw 50vh at 8% 0%, rgba(47,107,255,.10), transparent 70%),
      radial-gradient(55vw 45vh at 96% 100%, rgba(249,123,34,.12), transparent 70%);
  }
  .wrap{
    position:relative;height:100%;height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 20px)
            calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 20px);
    gap:clamp(8px,1.4vh,16px);
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;flex:0 0 auto}
  h1{font-size:clamp(26px,4.8vmin,50px);letter-spacing:-.02em;line-height:.95;font-weight:800}
  h1 span{color:var(--quiz)}
  .tagline{font-size:clamp(13px,1.9vmin,18px);font-weight:600;color:#6b6257;padding-bottom:.35em}
  .games{
    flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-auto-rows:minmax(0,1fr);gap:clamp(8px,1.4vmin,16px);
  }
  .game{
    position:relative;display:flex;flex-direction:column;justify-content:flex-end;
    text-align:left;font-family:inherit;cursor:pointer;color:inherit;
    border-radius:clamp(16px,2.2vmin,26px);border:3px solid var(--ink);background:#fff;
    box-shadow:0 clamp(4px,1vmin,8px) 0 rgba(34,36,44,.9);
    padding:clamp(10px,1.8vmin,18px);gap:2px;overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .game:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(34,36,44,.9)}
  .game::before{content:"";position:absolute;inset:0;background:var(--tint);opacity:.14;z-index:0}
  .game > *{position:relative;z-index:1}
  .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
       font-size:clamp(24px,5.2vmin,54px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
  .name{font-size:clamp(14px,2.3vmin,24px);font-weight:800;letter-spacing:-.01em;line-height:1.05}
  .meta{font-size:clamp(10px,1.45vmin,14px);font-weight:700;color:#6b6257;display:flex;justify-content:space-between;align-items:center;gap:4px 8px;flex-wrap:wrap}
  .stars{font-size:clamp(11px,1.6vmin,16px);letter-spacing:.06em;white-space:nowrap}
  .stars .off{opacity:.22}
  footer{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;
         font-size:clamp(10px,1.5vmin,13px);font-weight:700;color:#8a8073}
  .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#8a8073;margin:0 .35em .08em}

  #stage{
    position:fixed;inset:0;display:none;z-index:50;background:#0d1116;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #stage.on{display:block}
  #frame{width:100%;height:100%;border:0;display:block;background:#0d1116}

  @media (max-width:900px) and (orientation:portrait){
    .games{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media (max-height:560px){
    h1{font-size:clamp(20px,4.4vmin,32px)}
    .tagline{display:none}
    .art{font-size:clamp(18px,5vmin,34px)}
    .name{font-size:clamp(12px,2vmin,17px)}
    .meta{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Playroom">
<meta name="robots" content="noindex,nofollow">
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Play<span>room</span></h1>
    <div class="tagline">Pick a game. Tap to play.</div>
  </header>

  <main class="games">
    <button class="game" data-game="math" style="--tint:#2F6BFF">
      <div class="art">🔢</div>
      <div class="txt">
        <div class="name">Math Quest</div>
        <div class="meta"><span>Numbers &middot; 4&ndash;9</span><span class="stars" data-stars="math"></span></div>
      </div>
    </button>

    <button class="game" data-game="quiz" style="--tint:#F97B22">
      <div class="art">🦁</div>
      <div class="txt">
        <div class="name">Quiz Safari</div>
        <div class="meta"><span>Know-how &middot; 4&ndash;9</span><span class="stars" data-stars="quiz"></span></div>
      </div>
    </button>

    <button class="game" data-game="word" style="--tint:#1FA36B">
      <div class="art">🌱</div>
      <div class="txt">
        <div class="name">Word Garden</div>
        <div class="meta"><span>Crossword &middot; 5&ndash;9</span><span class="stars" data-stars="word"></span></div>
      </div>
    </button>

    <button class="game" data-game="memory" style="--tint:#9B5DE5">
      <div class="art">🃏</div>
      <div class="txt">
        <div class="name">Memory Match</div>
        <div class="meta"><span>Pairs &middot; 4&ndash;9</span><span class="stars" data-stars="memory"></span></div>
      </div>
    </button>

    <button class="game" data-game="wordbuild" style="--tint:#118AB2">
      <div class="art">🔤</div>
      <div class="txt">
        <div class="name">Word Builder</div>
        <div class="meta"><span>Spelling &middot; 5&ndash;9</span><span class="stars" data-stars="wordbuild"></span></div>
      </div>
    </button>

    <button class="game" data-game="arcade" style="--tint:#E4572E">
      <div class="art">🎯</div>
      <div class="txt">
        <div class="name">Tap Arcade</div>
        <div class="meta"><span>Reflexes &middot; 4&ndash;9</span><span class="stars" data-stars="arcade"></span></div>
      </div>
    </button>

    <button class="game" data-game="coins" style="--tint:#2E9E6B">
      <div class="art">🛒</div>
      <div class="txt">
        <div class="name">Coin Shop</div>
        <div class="meta"><span>Money &middot; 5&ndash;9</span><span class="stars" data-stars="coins"></span></div>
      </div>
    </button>

    <button class="game" data-game="clock" style="--tint:#7C5CFF">
      <div class="art">🕰️</div>
      <div class="txt">
        <div class="name">Clockwork</div>
        <div class="meta"><span>Time &middot; 5&ndash;9</span><span class="stars" data-stars="clock"></span></div>
      </div>
    </button>
  </main>

  <footer>
    <span>8 games<span class="dot"></span>works offline</span>
    <span>Made for iPad</span>
  </footer>
</div>

<div id="stage"><iframe id="frame" title="Game" allow="autoplay"></iframe></div>

<script>
var GAMES = {"math": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"theme-color\" content=\"#0E3B43\">\n<title>Math Quest<\/title>\n<style>\n  :root{\n    --ink:#12232b;\n    --deep:#0E3B43;\n    --deep2:#0a2c33;\n    --sun:#FFD24A;\n    --mint:#5FE0B0;\n    --coral:#FF6B5A;\n    --white:#FFFDF7;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:var(--deep);\n    color:var(--white);\n    font-family:ui-rounded,\"SF Pro Rounded\",-apple-system,system-ui,\"Segoe UI\",sans-serif;\n    -webkit-user-select:none;user-select:none;\n    -webkit-touch-callout:none;\n    -webkit-tap-highlight-color:transparent;\n    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;\n  }\n  body::before{\n    content:\"\";position:fixed;inset:0;pointer-events:none;\n    background:\n      radial-gradient(50vw 40vh at 100% 0%, rgba(95,224,176,.14), transparent 70%),\n      radial-gradient(45vw 40vh at 0% 100%, rgba(255,210,74,.10), transparent 70%);\n  }\n  #app{position:relative;height:100%;height:100dvh}\n  .screen{display:none;height:100%;flex-direction:column;padding:\n      calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px)\n      calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 18px);}\n  .screen.active{display:flex}\n\n  /* ---------- home ---------- */\n  #home{justify-content:center;align-items:center;gap:clamp(10px,2.2vh,22px);text-align:center}\n  .logo{font-size:clamp(44px,9vmin,84px);line-height:1}\n  h1{font-size:clamp(34px,7.4vmin,72px);font-weight:800;letter-spacing:-.03em;line-height:.95}\n  h1 em{font-style:normal;color:var(--sun)}\n  .sub{font-size:clamp(15px,2.4vmin,22px);font-weight:700;color:#9fd0cd;max-width:26ch}\n  .levels{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);width:min(560px,100%);margin-top:clamp(4px,1.4vh,14px)}\n  .level{\n    display:flex;align-items:center;gap:clamp(12px,2.6vmin,22px);\n    text-align:left;cursor:pointer;\n    background:rgba(255,255,255,.07);\n    border:3px solid rgba(255,255,255,.22);\n    color:var(--white);\n    border-radius:24px;\n    padding:clamp(12px,2vh,20px) clamp(14px,2.6vmin,24px);\n    font-family:inherit;\n    transition:transform .12s ease, background .15s ease;\n  }\n  .level:active{transform:scale(.98);background:rgba(255,255,255,.14)}\n  .level .big{font-size:clamp(30px,6vmin,52px);line-height:1}\n  .level .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}\n  .level .t b{font-size:clamp(19px,3.2vmin,30px);font-weight:800;letter-spacing:-.01em}\n  .level .t span{font-size:clamp(13px,2vmin,18px);font-weight:700;color:#9fd0cd}\n  .level .go{font-size:clamp(24px,4vmin,36px);color:var(--sun)}\n  .hint{font-size:clamp(12px,1.8vmin,16px);font-weight:600;color:#7fb2af}\n\n  /* ---------- game ---------- */\n  #game{gap:clamp(8px,1.8vh,18px)}\n  .bar{display:flex;align-items:center;gap:clamp(8px,1.6vmin,16px);flex:0 0 auto}\n  .icon{\n    width:clamp(44px,7vmin,58px);height:clamp(44px,7vmin,58px);\n    display:grid;place-items:center;\n    border-radius:16px;border:2px solid rgba(255,255,255,.25);\n    background:rgba(255,255,255,.08);color:var(--white);\n    font-size:clamp(20px,3.4vmin,26px);cursor:pointer;font-family:inherit;\n  }\n  .icon:active{background:rgba(255,255,255,.2)}\n  .dots{display:flex;gap:clamp(4px,.9vmin,8px);flex:1;justify-content:center}\n  .dots i{\n    width:clamp(9px,1.5vmin,14px);height:clamp(9px,1.5vmin,14px);border-radius:50%;\n    background:rgba(255,255,255,.18);transition:background .2s, transform .2s;\n  }\n  .dots i.done{background:var(--mint)}\n  .dots i.now{background:var(--sun);transform:scale(1.35)}\n  .score{\n    font-weight:800;font-size:clamp(15px,2.6vmin,22px);\n    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);\n    border-radius:999px;padding:.2em .7em;white-space:nowrap;\n  }\n\n  .q{\n    flex:1;min-height:0;\n    display:flex;flex-direction:column;align-items:center;justify-content:center;\n    gap:clamp(6px,1.6vh,18px);\n    text-align:center;\n  }\n  .visual{\n    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;\n    gap:clamp(2px,.8vmin,10px);\n    font-size:clamp(34px,8.4vmin,88px);line-height:1;\n    max-width:min(90vw,900px);\n    min-height:1em;\n  }\n  .visual .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(2px,.6vmin,8px);padding:0 clamp(4px,.9vmin,10px)}\n  .visual .op{font-size:.62em;font-weight:800;color:var(--sun);padding:0 clamp(2px,.8vmin,8px)}\n  .visual .x{opacity:.3;text-decoration:line-through}\n  .prompt{\n    font-size:clamp(40px,10vmin,110px);\n    font-weight:800;letter-spacing:-.03em;line-height:1.02;\n    font-variant-numeric:tabular-nums;\n  }\n  .prompt .gap{color:var(--sun)}\n\n  .answers{\n    flex:0 0 auto;\n    display:grid;grid-template-columns:1fr 1fr;\n    gap:clamp(8px,1.6vmin,16px);\n    width:min(720px,100%);margin:0 auto;\n  }\n  .ans{\n    font-family:inherit;\n    font-size:clamp(30px,6.4vmin,64px);\n    font-weight:800;font-variant-numeric:tabular-nums;\n    color:var(--ink);\n    background:var(--white);\n    border:3px solid var(--ink);\n    border-bottom-width:7px;\n    border-radius:clamp(16px,2.6vmin,24px);\n    padding:clamp(8px,2.2vh,26px) 8px;\n    min-height:clamp(72px,13vh,150px);\n    cursor:pointer;\n    transition:transform .1s ease, background .15s ease, border-color .15s ease;\n    display:grid;place-items:center;\n  }\n  .ans:active{transform:translateY(4px);border-bottom-width:3px}\n  .ans.ok{background:var(--mint);border-color:#0d5c42}\n  .ans.bad{background:var(--coral);border-color:#7a1e12;color:#fff;animation:shake .4s}\n  .ans.dim{opacity:.35}\n  .ans[disabled]{cursor:default}\n  @keyframes shake{\n    0%,100%{transform:translateX(0)}\n    20%{transform:translateX(-8px)}\n    40%{transform:translateX(8px)}\n    60%{transform:translateX(-5px)}\n    80%{transform:translateX(5px)}\n  }\n  .praise{\n    position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;\n    font-size:clamp(48px,14vmin,140px);font-weight:800;color:var(--sun);\n    text-shadow:0 6px 0 rgba(0,0,0,.25);\n    opacity:0;transform:scale(.6);\n  }\n  .praise.show{animation:pop .8s ease forwards}\n  @keyframes pop{\n    0%{opacity:0;transform:scale(.5) rotate(-6deg)}\n    35%{opacity:1;transform:scale(1.08) rotate(2deg)}\n    70%{opacity:1;transform:scale(1) rotate(0)}\n    100%{opacity:0;transform:scale(1.05) translateY(-24px)}\n  }\n\n  /* ---------- done ---------- */\n  #done{justify-content:center;align-items:center;gap:clamp(10px,2vh,22px);text-align:center}\n  .medal{font-size:clamp(64px,15vmin,140px);line-height:1;animation:bob 2.4s ease-in-out infinite}\n  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\n  .big-stars{font-size:clamp(34px,8vmin,72px);letter-spacing:.08em;color:var(--sun)}\n  .big-stars .off{opacity:.2}\n  .result-line{font-size:clamp(19px,3.4vmin,32px);font-weight:800;color:#cfeae7}\n  .result-line b{color:var(--sun)}\n  .btns{display:flex;flex-direction:column;gap:12px;width:min(420px,100%);margin-top:6px}\n  .btn{\n    font-family:inherit;font-size:clamp(18px,3vmin,26px);font-weight:800;\n    padding:clamp(12px,2.2vh,20px) 24px;border-radius:20px;cursor:pointer;\n    border:3px solid var(--ink);border-bottom-width:7px;\n    background:var(--sun);color:var(--ink);\n  }\n  .btn:active{transform:translateY(3px);border-bottom-width:3px}\n  .btn.ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.3)}\n  #fx{position:fixed;inset:0;pointer-events:none;z-index:9}\n  .allgames{\n    margin-top:2px;font-family:inherit;font-weight:800;font-size:clamp(13px,2vmin,17px);\n    color:inherit;opacity:.7;background:transparent;\n    border:2px solid rgba(255,255,255,.18);border-radius:999px;\n    padding:.4em .95em;cursor:pointer;\n  }\n  .allgames:active{opacity:1;background:rgba(255,255,255,.12)}\n  @media (prefers-reduced-motion:reduce){\n    *{animation-duration:.01ms !important;transition-duration:.01ms !important}\n  }\n  @media (max-height:520px){\n    .visual{font-size:clamp(20px,6vmin,40px)}\n    .prompt{font-size:clamp(30px,8vmin,60px)}\n    .ans{min-height:clamp(56px,16vh,90px);font-size:clamp(24px,5.6vmin,40px)}\n  }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n\n  <section class=\"screen active\" id=\"home\">\n    <div class=\"logo\">🚀<\/div>\n    <h1>Math <em>Quest<\/em><\/h1>\n    <p class=\"sub\">Ten questions. Tap the right answer.<\/p>\n    <div class=\"levels\">\n      <button class=\"level\" data-level=\"little\">\n        <span class=\"big\">🐣<\/span>\n        <span class=\"t\"><b>Little Numbers<\/b><span>counting &middot; add &amp; take away to 10<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n      <button class=\"level\" data-level=\"big\">\n        <span class=\"big\">🦊<\/span>\n        <span class=\"t\"><b>Big Numbers<\/b><span>3-digit sums &middot; tables to 12 &middot; fractions &middot; 2 steps<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n    <\/div>\n    <p class=\"hint\">Little Numbers is made for a 5-year-old. Big Numbers is a real challenge for an 8-year-old.<\/p>\n    <button class=\"allgames\" id=\"allGames\">⌂ All games<\/button>\n  <\/section>\n\n  <section class=\"screen\" id=\"game\">\n    <div class=\"bar\">\n      <button class=\"icon\" id=\"back\" aria-label=\"Back\">←<\/button>\n      <div class=\"dots\" id=\"dots\" aria-hidden=\"true\"><\/div>\n      <div class=\"score\" id=\"score\">0<\/div>\n      <button class=\"icon\" id=\"mute\" aria-label=\"Sound\">🔊<\/button>\n    <\/div>\n    <div class=\"q\">\n      <div class=\"visual\" id=\"visual\"><\/div>\n      <div class=\"prompt\" id=\"prompt\"><\/div>\n    <\/div>\n    <div class=\"answers\" id=\"answers\"><\/div>\n  <\/section>\n\n  <section class=\"screen\" id=\"done\">\n    <div class=\"medal\" id=\"medal\">🏆<\/div>\n    <div class=\"big-stars\" id=\"bigStars\"><\/div>\n    <div class=\"result-line\" id=\"resultLine\"><\/div>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"again\">Play again<\/button>\n      <button class=\"btn ghost\" id=\"change\">Change level<\/button>\n    <\/div>\n  <\/section>\n\n<\/div>\n<div class=\"praise\" id=\"praise\"><\/div>\n<canvas id=\"fx\"><\/canvas>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var $ = function(s){ return document.querySelector(s); };\n  var store = {\n    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },\n    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }\n  };\n  var embedded = (function(){ try { return window.parent && window.parent !== window; } catch(e){ return false; } })();\n  function toShell(msg){ try { if(embedded) parent.postMessage(msg, \"*\"); } catch(e){} }\n\n  var ri = function(a,b){ return Math.floor(Math.random()*(b-a+1))+a; };\n  var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };\n  function shuffle(a){\n    a = a.slice();\n    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n    return a;\n  }\n\n  /* ---------------- sound ---------------- */\n  var ac = null, muted = store.get(\"kg.mute\") === \"1\";\n  function audio(){\n    if(!ac){\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if(AC) ac = new AC();\n    }\n    if(ac && ac.state === \"suspended\") ac.resume();\n    return ac;\n  }\n  function tone(freq, dur, type, vol, delay){\n    if(muted) return;\n    var ctx = audio(); if(!ctx) return;\n    var t0 = ctx.currentTime + (delay || 0);\n    var o = ctx.createOscillator(), g = ctx.createGain();\n    o.type = type || \"sine\";\n    o.frequency.setValueAtTime(freq, t0);\n    g.gain.setValueAtTime(0, t0);\n    g.gain.linearRampToValueAtTime(vol == null ? .14 : vol, t0 + .012);\n    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);\n    o.connect(g); g.connect(ctx.destination);\n    o.start(t0); o.stop(t0 + dur + .02);\n  }\n  function sTap(){ tone(520,.07,\"triangle\",.07,0); }\n  function sRight(){ tone(660,.12,\"sine\",.13,0); tone(990,.16,\"sine\",.11,.09); }\n  function sWrong(){ tone(240,.18,\"triangle\",.11,0); tone(180,.22,\"triangle\",.10,.12); }\n  function sWin(){\n    [523,659,784,1047].forEach(function(f,i){ tone(f,.24,\"sine\",.12,i*.11); });\n  }\n  function syncMute(){ $(\"#mute\").textContent = muted ? \"🔇\" : \"🔊\"; }\n  syncMute();\n\n  /* ---------------- storage ---------------- */\n  function bestOf(k){ return parseInt(store.get(k) || \"0\", 10) || 0; }\n  function saveBest(k,v){ if(v > bestOf(k)) store.set(k, String(v)); }\n\n  /* ---------------- question factory ---------------- */\n  var BUGS = [\"🐞\",\"🐝\",\"🐸\",\"🐟\",\"🦋\",\"🐙\",\"🐢\",\"🦀\"];\n  var FRUIT = [\"🍎\",\"🍓\",\"🍊\",\"🍇\",\"🍋\",\"🍒\",\"🥕\",\"🍪\"];\n  var THINGS = [\"⭐\",\"🎈\",\"🧸\",\"🚗\",\"⚽\",\"🎁\",\"🌼\",\"🐬\"];\n\n  function numChoices(answer, spread){\n    var out = [answer], guard = 0;\n    while(out.length < 4 && guard++ < 200){\n      var d = ri(1, spread || 4) * (Math.random() < .5 ? -1 : 1);\n      var v = answer + d;\n      if(v >= 0 && out.indexOf(v) === -1) out.push(v);\n    }\n    while(out.length < 4){ var n = ri(0, answer + 9); if(out.indexOf(n) === -1) out.push(n); }\n    return shuffle(out);\n  }\n\n  function group(emoji, n, crossed){\n    var cells = \"\";\n    for(var i=0;i<n;i++){\n      cells += \"<span\" + (crossed && i >= n - crossed ? ' class=\"x\"' : \"\") + \">\" + emoji + \"<\/span>\";\n    }\n    return '<span class=\"grp\">' + cells + '<\/span>';\n  }\n\n  /* little: counting, add/sub within 10, missing addend */\n  function qCount(){\n    var e = pick(BUGS), n = ri(2,9);\n    return {\n      visual: group(e, n),\n      prompt: \"How many?\",\n      answer: n,\n      choices: numChoices(n, 3),\n      say: \"How many?\"\n    };\n  }\n  function qAddSmall(){\n    var e = pick(FRUIT), a = ri(1,5), b = ri(1, 9-a);\n    if(a + b < 3){ b = 2; }\n    return {\n      visual: group(e,a) + '<span class=\"op\">+<\/span>' + group(e,b),\n      prompt: a + \" + \" + b + \" = ?\",\n      answer: a + b,\n      choices: numChoices(a + b, 3),\n      say: a + \" plus \" + b\n    };\n  }\n  function qSubSmall(){\n    var e = pick(THINGS), a = ri(4,10), b = ri(1, Math.min(5, a-1));\n    return {\n      visual: group(e, a, b),\n      prompt: a + \" − \" + b + \" = ?\",\n      answer: a - b,\n      choices: numChoices(a - b, 3),\n      say: a + \" take away \" + b\n    };\n  }\n  function qMissingSmall(){\n    var a = ri(1,5), b = ri(2, 9-a), sum = a + b;\n    return {\n      visual: \"\",\n      prompt: a + ' + <span class=\"gap\">?<\/span> = ' + sum,\n      answer: b,\n      choices: numChoices(b, 3),\n      say: a + \" plus what makes \" + sum\n    };\n  }\n  /* ---- big: 3-digit arithmetic, tables to 12, fractions, sequences ---- */\n  /* wrong answers are built from the mistakes children actually make:\n     forgetting to carry, shifting a place, using the other factor */\n  function offsetsChoices(ans, offsets){\n    var out = [ans], offs = shuffle(offsets);\n    for(var i=0;i<offs.length && out.length<4;i++){\n      var v = ans + offs[i];\n      if(v >= 0 && out.indexOf(v) === -1) out.push(v);\n    }\n    var guard = 0;\n    while(out.length < 4 && guard++ < 60){\n      var step = Math.max(3, Math.round(Math.abs(ans) * 0.15));\n      var w = ans + ri(1, step) * (Math.random() < .5 ? -1 : 1);\n      if(w >= 0 && out.indexOf(w) === -1) out.push(w);\n    }\n    return shuffle(out);\n  }\n\n  function qTimes12(){\n    var a = ri(3,12), b = ri(3,12), ans = a * b;\n    return { visual:\"\", prompt:a + \" × \" + b + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [1,-1,a,-a,b,-b,10,-10]), say:a + \" times \" + b };\n  }\n  function qTwoDigitTimes(){\n    var a = ri(12,29), b = ri(3,9), ans = a * b;\n    return { visual:\"\", prompt:a + \" × \" + b + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [b,-b,10,-10,a,-a]), say:a + \" times \" + b };\n  }\n  function qAdd3(){\n    var a = ri(140,680), b = ri(120, 999 - a), ans = a + b;\n    return { visual:\"\", prompt:a + \" + \" + b + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [10,-10,100,-100,1,-1]), say:a + \" plus \" + b };\n  }\n  function qSub3(){\n    var a = ri(320,999), b = ri(120, a - 90), ans = a - b;\n    return { visual:\"\", prompt:a + \" − \" + b + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [10,-10,100,-100,1,-1]), say:a + \" take away \" + b };\n  }\n  function qDivideBig(){\n    var b = ri(3,12), ans = ri(4,12), a = b * ans;\n    return { visual:\"\", prompt:a + \" ÷ \" + b + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [1,-1,2,-2,b,-b]), say:a + \" divided by \" + b };\n  }\n  function qMissingFactorBig(){\n    var a = ri(4,12), b = ri(4,12), prod = a * b;\n    return { visual:\"\", prompt:a + ' × <span class=\"gap\">?<\/span> = ' + prod, answer:b,\n      choices: offsetsChoices(b, [1,-1,2,-2]), say:a + \" times what makes \" + prod };\n  }\n  function qMultiStep(){\n    var a = ri(3,9), b = ri(3,9), c = ri(2,20), ans = a * b + c;\n    return { visual:\"\", prompt:a + \" × \" + b + \" + \" + c + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [1,-1,a,-a,c,-c,10,-10]), say:a + \" times \" + b + \" plus \" + c };\n  }\n  function qFraction(){\n    var d = pick([2,3,4]);\n    var n = Math.random() < .5 ? 1 : ri(1, d - 1);\n    var base = ri(3,12) * d;              // always divides exactly\n    var ans = base / d * n;\n    return { visual:\"\", prompt:n + \"/\" + d + \" of \" + base + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [d,-d,n,-n,1,-1]), say:n + \" over \" + d + \" of \" + base };\n  }\n  function qSequence(){\n    var a = ri(2,20), k = ri(3,9);\n    var terms = [a, a+k, a+2*k, a+3*k];\n    var ans = a + 4*k;\n    return { visual:\"\", prompt:terms.join(\", \") + ', <span class=\"gap\">?<\/span>', answer:ans,\n      choices: offsetsChoices(ans, [1,-1,k,-k,2,-2]), say:terms.join(\", \") };\n  }\n  function qMissingAdd3(){\n    var a = ri(120,600), b = ri(40,300), sum = a + b;\n    return { visual:\"\", prompt:a + ' + <span class=\"gap\">?<\/span> = ' + sum, answer:b,\n      choices: offsetsChoices(b, [10,-10,100,-100]), say:a + \" plus what makes \" + sum };\n  }\n  function qPlaceValue(){\n    var a = ri(30,90) * 10, b = ri(2,9), ans = a * b;\n    return { visual:\"\", prompt:a + \" × \" + b + \" = ?\", answer:ans,\n      choices: offsetsChoices(ans, [10,-10,100,-100,1000,-1000]), say:a + \" times \" + b };\n  }\n\n  var MAKERS = {\n    little: [qCount, qAddSmall, qSubSmall, qMissingSmall, qAddSmall, qSubSmall, qCount],\n    big: [qTimes12, qTwoDigitTimes, qAdd3, qSub3, qDivideBig, qMissingFactorBig,\n          qMultiStep, qFraction, qSequence, qMissingAdd3, qPlaceValue]\n  };\n\n  /* ---------------- game state ---------------- */\n  var TOTAL = 10;\n  var state = { level:\"little\", qs:[], i:0, right:0, locked:false };\n\n  function makeRound(level){\n    var makers = MAKERS[level], qs = [], seen = {}, guard = 0;\n    while(qs.length < TOTAL && guard++ < 800){\n      var q = pick(makers)();\n      if(seen[q.prompt]) continue;\n      seen[q.prompt] = 1;\n      q.choices = q.choices.slice(0,4);\n      qs.push(q);\n    }\n    return qs;\n  }\n\n  function show(id){\n    Array.prototype.forEach.call(document.querySelectorAll(\".screen\"), function(s){\n      s.classList.remove(\"active\");\n    });\n    document.getElementById(id).classList.add(\"active\");\n    if(id !== \"done\" && typeof cx !== \"undefined\" && cx){\n      parts = []; cx.clearRect(0,0,innerWidth,innerHeight);\n    }\n  }\n\n  function startGame(level){\n    state.level = level;\n    state.qs = makeRound(level);\n    state.i = 0; state.right = 0; state.locked = false;\n    show(\"game\");\n    paintDots();\n    render();\n  }\n\n  function paintDots(){\n    var html = \"\";\n    for(var i=0;i<TOTAL;i++){\n      var cls = i < state.i ? \"done\" : (i === state.i ? \"now\" : \"\");\n      html += '<i class=\"' + cls + '\"><\/i>';\n    }\n    $(\"#dots\").innerHTML = html;\n    $(\"#score\").textContent = \"⭐ \" + state.right;\n  }\n\n  function render(){\n    var q = state.qs[state.i];\n    state.locked = false;\n    $(\"#visual\").innerHTML = q.visual || \"\";\n    $(\"#visual\").style.display = q.visual ? \"flex\" : \"none\";\n    $(\"#prompt\").innerHTML = q.prompt;\n\n    var box = $(\"#answers\");\n    box.innerHTML = \"\";\n    q.choices.forEach(function(v){\n      var b = document.createElement(\"button\");\n      b.className = \"ans\";\n      b.type = \"button\";\n      b.textContent = v;\n      b.addEventListener(\"click\", function(){ answer(v, b); });\n      box.appendChild(b);\n    });\n    paintDots();\n  }\n\n  function answer(v, btn){\n    if(state.locked) return;\n    state.locked = true;\n    var q = state.qs[state.i];\n    var ok = Number(v) === Number(q.answer);\n\n    Array.prototype.forEach.call(document.querySelectorAll(\".ans\"), function(b){\n      b.disabled = true;\n      if(Number(b.textContent) === Number(q.answer)) b.classList.add(\"ok\");\n    });\n\n    if(ok){\n      state.right++;\n      sRight();\n      praise();\n      btn.classList.add(\"ok\");\n      $(\"#score\").textContent = \"⭐ \" + state.right;\n      setTimeout(next, 800);\n    } else {\n      sWrong();\n      btn.classList.add(\"bad\");\n      setTimeout(next, 1700);\n    }\n  }\n\n  var PRAISE = [\"Yes!\", \"Nice!\", \"Super!\", \"Wow!\", \"Math star!\", \"💥\", \"Got it!\"];\n  function praise(){\n    var el = $(\"#praise\");\n    el.textContent = pick(PRAISE) state.endsAt = performance.now() + ROUND_MS;\n    state.nextSpawn = performance.now() + 500;\n    requestAnimationFrame(loop);\n  }\n\n  function spawn(){\n    var free = state.cells.filter(function(c){ return !c.busy; });\n    if(!free.length) return;\n    var cell = free[ri(0, free.length-1)];\n    var r = Math.random();\n    var kind = \"mole\";\n    if(state.level === \"big\"){\n      if(r < 0.18) kind = \"bomb\";\n      else if(r < 0.28) kind = \"gold\";\n    }\n    cell.busy = true; cell.kind = kind;\n    cell.until = performance.now() + state.life;\n    var glyph = kind === \"mole\" ? \"🐹\" : kind === \"bomb\" ? \"💣\" : \"⭐\";\n    cell.el.innerHTML = '<span class=\"glyph\">' + glyph + '<\/span>';\n    cell.el.classList.toggle(\"bomb\", kind === \"bomb\");\n    cell.el.classList.toggle(\"gold\", kind === \"gold\");\n  }\n\n  function hit(el){\n    if(!state.running) return;\n    var idx = +el.dataset.i;\n    var cell = state.cells[idx];\n    if(!cell.busy) return;\n    el.classList.add(\"pop\");\n    setTimeout(function(){ el.classList.remove(\"pop\"); }, 90);\n\n    if(cell.kind === \"mole\"){ state.score += 1; sGood(); float(cell.el, \"+1\", false); }\n    else if(cell.kind === \"gold\"){ state.score += 3; sGold(); float(cell.el, \"+3\", false); }\n    else { state.score = Math.max(0, state.score - 1); sBad(); float(cell.el, \"-1\", true); }\n    $(\"#score\").textContent = state.score;\n    clear(cell);\n  }\n\n  function float(el, text, bad){\n    var s = document.createElement(\"span\");\n    s.className = \"float\" + (bad ? \" bad\" : \"\");\n    s.textContent = text;\n    el.appendChild(s);\n    setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 700);\n  }\n\n  function clear(cell){\n    cell.busy = false; cell.kind = null; cell.until = 0;\n    cell.el.innerHTML = \"\";\n    cell.el.classList.remove(\"bomb\",\"gold\");\n  }\n\n  function loop(now){\n    if(!state.running) return;\n    var left = state.endsAt - now;\n    if(left <= width = innerWidth + \"px\"; cv.style.height = innerHeight + \"px\";\n    cx.setTransform(dpr,0,0,dpr,0,0);\n  }\n  sizeCanvas(); addEventListener(\"resize\", sizeCanvas);\n  function confetti(){\n    var colors = [\"#B6F25A\",\"#FF6B9D\",\"#FFC93C\",\"#FFF8E7\"];\n    parts = [];\n    for(var i=0;i<90;i++){\n      parts.push({ x: innerWidth/2 + (Math.random()-.5)*innerWidth*.5,\n        y: innerHeight*.42 + (Math.random()-.5)*60,\n        vx:(Math.random()-.5)*9, vy:-6-Math.random()*9,\n        s:5+Math.random()*8, c:colors[i%colors.length],\n        r:Math.random()*6, vr:(Math.random()-.5)*.3, life:1 });\n    }\n    if(!raf) tick();\n  }\n  function tick(){\n    cx.clearRect(0,0,innerWidth,innerHeight);\n    var alive = 0;\n    for(var i=0;i<parts.length;i++){\n      var p = parts[i];\n      p.vy += .32; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;\n      if(p.life <= 0 || p.y > innerHeight + 40) continue;\n      alive++;\n      cx.save();\n      cx.globalAlpha = Math.max(0, Math.min(1, p.life*1.6));\n      cx.translate(p.x,p.y); cx.rotate(p.r);\n      cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);\n      cx.restore();\n    }\n    if(alive){ raf = requestAnimationFrame(tick); }\n    else { raf = 0; cx.clearRect(0,0,innerWidth,innerHeight); }\n  }\n\n  /* ---------------- wiring ---------------- */\n  Array.prototype.forEach.call(document.querySelectorAll(\".level\"), function(b){\n    b.addEventListener(\"click\", function(){ audio(); startGame(b.dataset.level); });\n  });\n  $(\"#back\").addEventListener(\"click\", function(){ state.running = false; show(\"home\"); });\n  $(\"#again\").addEventListener(\"click\", function(){ audio(); startGame(state.level); });\n  $(\"#change\").addEventListener(\"click\", function(){ state.running = false; show(\"home\"); });\n  $(\"#mute\").addEventListener(\"click\", function(){\n    muted = !muted; store.set(\"kg.mute\", muted ? \"1\" : \"0\"); syncMute(); if(!muted) tone(600,.06,\"triangle\",.07,0);\n  });\n  $(\"#allGames\").addEventListener(\"click\", function(){\n    state.running = false;\n    if(embedded){ toShell({kg:\"home\"}); } else { location.href = \"index.html\"; }\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "coins": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"theme-color\" content=\"#153A2C\">\n<title>Coin Shop<\/title>\n<style>\n  :root{\n    --ink:#13251c;\n    --deep:#153A2C;\n    --deep2:#0e2a20;\n    --gold:#FFD24A;\n    --mint:#6FE3B4;\n    --coral:#FF6B5A;\n    --white:#FFFDF5;\n    --copper:#C97B4A;\n    --silver:#C9CFD6;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:var(--deep);\n    color:var(--white);\n    font-family:ui-rounded,\"SF Pro Rounded\",-apple-system,system-ui,\"Segoe UI\",sans-serif;\n    -webkit-user-select:none;user-select:none;\n    -webkit-touch-callout:none;\n    -webkit-tap-highlight-color:transparent;\n    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;\n  }\n  body::before{\n    content:\"\";position:fixed;inset:0;pointer-events:none;\n    background:\n      radial-gradient(50vw 40vh at 100% 0%, rgba(255,210,74,.12), transparent 70%),\n      radial-gradient(45vw 40vh at 0% 100%, rgba(111,227,180,.10), transparent 70%);\n  }\n  #app{position:relative;height:100%;height:100dvh}\n  .screen{display:none;height:100%;flex-direction:column;padding:\n      calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px)\n      calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 18px);}\n  .screen.active{display:flex}\n\n  /* ---------- home ---------- */\n  #home{justify-content:center;align-i px,5.2vmin,52px);font-weight:800;font-variant-numeric:tabular-nums;\n    color:var(--gold);\n  }\n  .total span{font-size:.5em;color:#a8d8c6;font-weight:800;letter-spacing:.04em}\n  @keyframes shake{\n    0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}\n    50%{transform:translateX(7px)}75%{transform:translateX(-4px)}\n  }\n\n  /* coins */\n  .coin{\n    --c:#C9CFD6;\n    width:var(--w);height:var(--w);border-radius:50%;\n    display:grid;place-items:center;position:relative;\n    font-family:inherit;font-weight:800;cursor:pointer;\n    color:#2a2318;\n    background:radial-gradient(circle at 34% 28%, #fff9, transparent 46%), var(--c);\n    border:0;flex:0 0 auto;\n    box-shadow:inset 0 -6px 0 rgba(0,0,0,.22), inset 0 4px 0 rgba(255,255,255,.55), 0 5px 0 rgba(0,0,0,.35);\n    transition:transform .1s ease, box-shadow .1s ease;\n  }\n  .coin:active{transform:translateY(4px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.5), 0 1px 0 rgba(0,0,0,.35)}\n  .coin b{font-size:.44em;line-height:1}\n  .coin i{font-size:.3em;font-style:normal;opacity:.7;display:block;margin-top:.1em}\n  .coin.penny{--c:var(--copper);--w:clamp(52px,8.4vmin,80px)}\n  .coin.nickel{--c:var(--silver);--w:clamp(58px,9.4vmin,90px)}\n  .coin.dime{--c:#B9C4CC;--w:clamp(44px,7.2vmin,68px)}\n  .coin.quarter{--c:#D8DEE4;--w:clamp(66px,10.6vmin,102px)}\n  .coins{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.4vmin,26px);flex:0 0 auto;flex-wrap:wrap}\n  .tools{display:flex;gap:clamp(8px,1.6vmin,16px);flex:0 0 auto;justify-content:center}\n  #payArea{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);flex:0 0 auto}\n  #payArea.off{display:none}\n  .answers{display:none;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vmin,16px);width:min(600px,100%)}\n  .answers.on{display:grid}\n  .ans{\n    font-family:inherit;font-size:clamp(20px,4.2vmin,38px);font-weight:800;font-variant-numeric:tabular-nums;\n    color:var(--ink);background:var(--white);border:3px solid var(--ink);border-bottom-width:7px;\n    border-radius:clamp(14px,2.2vmin,20px);padding:clamp(8px,1.4vh,16px);cursor:pointer;\n  }\n  .ans:active{transform:translateY(3px);border-bottom-width:4px}\n  .ans.ok{background:var(--mint);border-color:#0d5c42}\n  .ans.bad{background:var(--coral);color:#fff;border-color:#7a1e12}\n  .ans.dim{opacity:.35}\n  .tool{\n    font-family:inherit;font-weight:800;font-size:clamp(14px,2.2vmin,19px);\n    padding:.5em 1.1em;border-radius:999px;cursor:pointer;\n    color:var(--white);background:rgba(255,255,255,.08);\n    border:2px solid rgba(255,255,255,.24);\n  }\n  .tool:active{background:rgba(255,255,255,.2)}\n  .till .coin{transform:scale(.8);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.5)}\n\n  /* ---------- done ---------- */\n  #done{justify-content:center;align-items:center;gap:clamp(10px,2vh,22px);text-align:center}\n  .medal{font-size:clamp(64px,15vmin,140px);line-height:1;animation:bob 2.4s ease-in-out infinite}\n  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\n  .big-stars{font-size:clamp(34px,8vmin,72px);letter-spacing:.08em;color:var(--gold)}\n  .big-stars .off{opacity:.2}\n  .result-line{font-size:clamp(19px,3.4vmin,32px);font-weight:800;color:#cfeae0}\n  .result-line b{color:var(--gold)}\n  .btns{display:flex;flex-direction:column;gap:12px;width:min(420px,100%);margin-top:6px}\n  .btn{\n    font-family:inherit;font-size:clamp(18px,3vmin,26px);font-weight:800;\n    padding:clamp(12px,2.2vh,20px) 24px;border-radius:20px;cursor:pointer;\n    border:3px solid var(--ink);border-bottom-width:7px;\n    background:var(--gold);color:var(--ink);\n  }\n  .btn:active{transform:translateY(3px);border-bottom-width:3px}\n  .btn.ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.3)}\n  .praise{\n    position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;\n    font-size:clamp(48px,14vmin,140px);font-weight:800;color:var(--gold);\n    text-shadow:0 6px 0 rgba(0,0,0,.25);opacity:0;transform:scale(.6);\n  }\n  .praise.show{animation:pop .8s ease forwards}\n  @keyframes pop{\n    0%{opacity:0;transform:scale(.5) rotate(-6deg)}\n    35%{opacity:1;transform:scale(1.08) rotate(2deg)}\n    70%{opacity:1;transform:scale(1) rotate(0)}\n    100%{opacity:0;transform:scale(1.05) translateY(-24px)}\n  }\n  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}\n  @media (max-height:520px){\n    .price{font-size:clamp(30px,9vmin,52px)}\n    .till{min-height:44px}\n    .coin.penny{--w:44px}.coin.nickel{--w:48px}.coin.dime{--w:38px}.coin.quarter{--w:54px}\n  }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n\n  <section class=\"screen active\" id=\"home\">\n    <div class=\"logo\">🛒<\/div>\n    <h1>Coin <em>Shop<\/em><\/h1>\n    <p class=\"sub\">Count the coins. Pay the right amount.<\/p>\n    <div class=\"levels\">\n      <button class=\"level\" data-level=\"little\">\n        <span class=\"big\">🐣<\/span>\n        <span class=\"t\"><b>Pay the Price<\/b><span>count coins up to $1.00<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n      <button class=\"level\" data-level=\"big\">\n        <span class=\"big\">🦊<\/span>\n        <span class=\"t\"><b>Make Change<\/b><span>change from $1, $2, $5 or $10<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n    <\/div>\n    <p class=\"hint\">Pennies, nickels, dimes and quarters. Tap a coin to drop it in the till.<\/p>\n    <button class=\"allgames\" id=\"allGames\">⌂ All games<\/button>\n  <\/section>\n\n  <section class=\"screen\" id=\"game\">\n    <div class=\"bar\">\n      <button class=\"icon\" id=\"back\" aria-label=\"Back\">←<\/button>\n      <div class=\"dots\" id=\"dots\" aria-hidden=\"true\"><\/div>\n      <div class=\"score\" id=\"score\">0<\/div>\n      <button class=\"icon\" id=\"mute\" aria-label=\"Sound\">🔊<\/button>\n    <\/div>\n\n    <div class=\"board\">\n      <div class=\"task\" id=\"task\"><\/div>\n      <div class=\"price\" id=\"price\"><\/div>\n      <div class=\"answers\" id=\"answers\"><\/div>\n      <div class=\"till\" id=\"till\"><span class=\"none\">tap coins to fill the till<\/span><\/div>\n      <div class=\"total\" id=\"total\"><\/div>\n    <\/div>\n\n    <div id=\"payArea\">\n      <div class=\"coins\" id=\"coins\"><\/div>\n      <div class=\"tools\">\n        <button class=\"tool\" id=\"undo\">↩ Undo<\/button>\n        <button class=\"tool\" id=\"clear\">Clear<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"screen\" id=\"done\">\n    <div class=\"medal\" id=\"medal\">🏆<\/div>\n    <div class=\"big-stars\" id=\"bigStars\"><\/div>\n    <div class=\"result-line\" id=\"resultLine\"><\/div>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"again\">Play again<\/button>\n      <button class=\"btn ghost\" id=\"change\">Change level<\/button>\n    <\/div>\n  <\/section>\n\n<\/div>\n<div class=\"praise\" id=\"praise\"><\/div>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var $ = function(s){ return document.querySelector(s); };\n  var store = {\n    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },\n    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }\n  };\n  var embedded = (function(){ try { return window.parent && window.parent !== window; } catch(e){ return false; } })();\n  function toShell(msg){ try { if(embedded) parent.postMessage(msg, \"*\"); } catch(e){} }\n\n  var ri = function(a,b){ return Math.floor(Math.random()*(b-a+1))+a; };\n  var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };\n  function shuffle(a){\n    a = a.slice();\n    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n    return a;\n  }\n  function money(cents){\n    var d = Math.floor(cents/100), c = cents % 100;\n    return \"$\" + d + \".\" + (c < 10 ? \"0\" : \"\") + c;\n  }\n  function short(cents){\n    if(cents < 100) return cents + \"¢\";\n    return money(cents);\n  }\n\n  /* ---------------- sound ---------------- */\n  var ac = null, muted = store.get(\"kg.mute\") === \"1\";\n  function audio(){\n    if(!ac){\n      var AC = window.AudioContext || window.webkitAudioContext;\n      if(AC) ac = new AC();\n    }\n    if(ac && ac.state === \"suspended\") ac.resume();\n    return ac;\n  }\n  function tone(freq, dur, type, vol, delay){\n    if(muted) return;\n    var ctx = audio(); if(!ctx) return;\n    var t0 = ctx.currentTime + (delay || 0);\n    var o = ctx.createOscillator(), g = ctx.createGain();\n    o.type = type || \"sine\";\n    o.frequency.setValueAtTime(freq, t0);\n    g.gain.setValueAtTime(0, t0);\n    g.gain.linearRampToValueAtTime(vol == null ? .14 : vol, t0 + .012);\n    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);\n    o.connect(g); g.connect(ctx.destination);\n    o.start(t0); o.stop(t0 + dur + .02);\n  }\n  function sTap(){ tone(520,.06,\"triangle\",.06,0); }\n  function sClink(){ tone(1250,.07,\"triangle\",.07,0); tone(1900,.05,\"sine\",.04,.03); }\n  function sRight(){ tone(660,.12,\"sine\",.13,0); tone(990,.16,\"sine\",.11,.09); }\n  function sWrong(){ tone(200,.16,\"square\",.07,0); }\n  function sWin(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.24,\"sine\",.12,i*.11); }); }\n  function syncMute(){ $(\"#mute\").textContent = muted ? \"🔇\" : \"🔊\"; }\n  syncMute();\n\n  /* ---------------- storage ---------------- */\n  var BEST = \"kg.best.coins\";\n  function bestOf(){ return parseInt(store.get(BEST) || \"0\", 10) || 0; }\n  function saveBest(v){ if(v > bestOf()) store.set(BEST, String(v)); }\n\n  /* ---------------- round factory ---------------- */\n  var TOTAL = 8;\n  var COINS = [\n    { v:1,  cls:\"penny\",   label:\"1¢\" },\n    { v:5,  cls:\"nickel\",  label:\"5¢\" },\n    { v:10, cls:\"dime\",    label:\"10¢\" },\n    { v:25, cls:\"quarter\", label:\"25¢\" }\n  ];\n\n  /* big level: distractors come from the mistakes children actually make --\n     adding instead of subtracting, losing a hundred, dropping a ten */\n  function changeChoices(c){\n    var out = [c], cands = [c + 100, c - 100, c + 10, c - 10, c + 1, c - 1, c + 90, c - 5];\n    cands = shuffle(cands);\n    for(var i = 0; i < cands.length && out.length < 4; i++){\n      var v = cands[i];\n      if(v > 0 && out.indexOf(v) === -1) out.push(v);\n    }\n    return shuffle(out);\n  }\n\n  /* little: pay a price under a dollar. big: work out the change, then build it. */\n  function makeQuestion(level, exclude){\n    var q, guard = 0;\n    do {\n      if(level === \"little\"){\n        var price = ri(1, 20) * 5 + ri(0, 4);          // 5¢ steps + pennies, keeps targets varied\n        if(price > 99) price = 95 + ri(0, 4);\n        price = Math.max(11, Math.min(99, price));\n        q = { kind:\"pay\", target: price, price: price,\n              task: \"Pay \" + price + \"¢ for the treat\" };\n      } else {\n        var note = pick([100, 200, 500, 500, 1000]);\n        var change = ri(5, 125);                         // keeps the coin count a handful\n        var cost = note - change;\n        q = { kind:\"change\", target: change, price: cost, note: note,\n              task: \"You gave \" + money(note) + \" for a \" + money(cost) + \" toy\",\n              ask: { answer: change, choices: changeChoices(change) } };\n      }\n      guard++;\n    } while(q && exclude && exclude[q.price] === 1 && guard < 30);\n    return q;\n  }\n\n  /* ---------------- state ---------------- */\n  var state = { level:\"little\", target:0, price:0, note:0, added:[], i:0, right:0, locked:false, round:[] };\n\n  function show(id){\n    Array.prototype.forEach.call(document.querySelectorAll(\".screen\"), function(s){\n      s.classList.remove(\"active\");\n    });\n    document.getElementById(id).classList.add(\"active\");\n  }\n\n  function buildRound(level){\n    var qs = [], seen = {}, guard = 0;\n    while(qs.length < TOTAL && guard++ < 300){\n      var q = makeQuestion(level, seen);\n      if(seen[q.price]) continue;\n      seen[q.price] = 1;\n      qs.push(q);\n    }\n    return qs;\n  }\n\n  function startGame(level){\n    state.level = level;\n    state.round = buildRound(level);\n    state.i = 0; state.right = 0;\n    show(\"game\");\n    paintCoinButtons();\n    loadQuestion();\n  }\n\n  function paintCoinButtons(){\n    var box = $(\"#coins\");\n    box.innerHTML = \"\";\n    COINS.forEach(function(c){\n      var b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.className = \"coin \" + c.cls;\n      b.dataset.v = String(c.v);\n      b.setAttribute(\"aria-label\", c.label);\n      b.innerHTML = \"<b>\" + c.label + \"<\/b>\";\n      b.addEventListener(\"click\", function(){ addCoin(c.v); });\n      box.appendChild(b);\n    });\n  }\n\n  function loadQuestion(){\n    var q = state.round[state.i];\n    state.target = q.target;\n    state.price = q.price;\n    state.note = q.note || 0;\n    state.added = [];\n    state.locked = false;\n    state.phase = q.ask ? \"ask\" : \"pay\";\n    $(\"#task\").textContent = q.task;\n    $(\"#till\").className = \"till\";\n    $(\"#till\").innerHTML = '<span class=\"none\">tap coins to fill the till<\/span>';\n    $(\"#total\").innerHTML = \"0¢ <span>in the till<\/span>\";\n\n    if(state.phase === \"ask\"){\n      $(\"#price\").innerHTML = '?<small>how much change?<\/small>';\n      $(\"#payArea\").classList.add(\"off\");\n      $(\"#till\").style.display = \"none\";\n      $(\"#total\").style.display = \"none\";\n      renderChoices(q.ask);\n    } else {\n      $(\"#price\").innerHTML = q.price + \"¢<small>to pay<\/small>\";\n      $(\"#payArea\").classList.remove(\"off\");\n      $(\"#till\").style.display = \"\";\n      $(\"#total\").style.display = \"\";\n      $(\"#answers\").classList.remove(\"on\");\n      $(\"#answers\").innerHTML = \"\";\n    }\n    paintDots();\n  }\n\n  function renderChoices(ask){\n    var box = $(\"#answers\");\n    box.innerHTML = \"\";\n    box.classList.add(\"on\");\n    ask.choices.forEach(function(v){\n      var b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.className = \"ans\";\n      b.textContent = money(v);\n      b.dataset.v = String(v);\n      b.addEventListener(\"click\", function(){ answerChange(v, b); });\n      box.appendChild(b);\n    });\n  }\n\n  function answerChange(v, btn){\n    if(state.locked) return;\n    state.locked = true;\n    var right = state.round[state.i].ask.answer;\n    Array.prototype.forEach.call(document.querySelectorAll(\".ans\"), function(b){\n      b.disabled = true;\n      if(Number(b.dataset.v) === right) b.classList.add(\"ok\");\n      else b.classList.add(\"dim\");\n    });\n    if(v === right){\n      sRight();\n      setTimeout(startPay, 650);\n    } else {\n      sWrong();\n      btn.classList.remove(\"dim\");\n      btn.classList.add(\"bad\");\n      setTimeout(next, 1700);\n    }\n  }\n\n  function startPay(){\n    state.locked = false;\n    state.phase = \"pay\";\n    $(\"#answers\").classList.remove(\"on\");\n    $(\"#answers\").innerHTML = \"\";\n    $(\"#price\").innerHTML = money(state.target) + \"<small>change<\/small>\";\n    $(\"#payArea\").classList.remove(\"off\");\n  }\n\n  function paintDots(){\n    var html = \"\";\n    for(var i=0;i<TOTAL;i++){\n      var cls = i < state.i ? \"done\" : (i === state.i ? \"now\" : \"\");\n      html += '<i class=\"' + cls + '\"><\/i>';\n    }\n    $(\"#dots\").innerHTML = html;\n    $(\"#score\").textContent = \"⭐ \" + state.right;\n  }\n\n  function sum(){\n    var t = 0;\n    for(var i=0;i<state.added.length;i++) t += state.added[i];\n    return t;\n  }\n\n  function paintTill(){\n    var t = sum(), box = $(\"#till\");\n    if(!state.added.length){\n      box.innerHTML = '<span class=\"none\">tap coins to fill the till<\/span>';\n    } else {\n      box.innerHTML = state.added.map(function(v){\n        var c = COINS.filter(function(x){ return x.v === v; })[0];\n        return '<span class=\"coin ' + c.cls + '\"><b>' + c.label + '<\/b><\/span>';\n      }).join(\"\");\n    }\n    box.className = \"till\" + (t > state.target ? \" over\" : (t === state.target && t > 0 ? \" good\" : \"\"));\n    $(\"#total\").innerHTML = short(t) + ' <span>' + (state.level === \"little\" ? \"in the till\" : \"given back\") + \"<\/span>\";\n  }\n\n  function addCoin(v){\n    if(state.locked) return;\n    audio();\n    var t = sum() + v;\n    if(t > state.target){\n      sWrong();\n      var box = $(\"#till\");\n      box.classList.add(\"over\");\n      setTimeout(function(){ box.classList.remove(\"over\"); }, 380);\n      return;\n    }\n    state.added.push(v);\n    sClink();\n    paintTill();\n    if(t === state.target) settle(true);\n  }\n\n  function settle(ok){\n    state.locked = true;\n    if(ok){\n      state.right++;\n      sRight();\n      praise();\n      $(\"#score\").textContent = \"⭐ \" + state.right;\n      setTimeout(next, 950);\n    } else {\n      sWrong();\n      setTimeout(next, 1500);\n    }\n  }\n\n  var PRAISE = [\"Yes!\", \"Paid!\", \"Nice!\", \"Cha-ching!\", \"Perfect!\", \"💰\"];\n  function praise(){\n    var el = $(\"#praise\");\n    el.textContent = pick(PRAISE);\n    el.classList.remove(\"show\");\n    void el.offsetWidth;\n    el.classList.add(\"show\");\n  }\n\n  function next(){\n    state.i++;\n    if(state.i >= TOTAL){ finish(); return; }\n    loadQuestion();\n  }\n\n  function starsFor(right){\n    if(right >= TOTAL) return 3;\n    if(right >= TOTAL - 2) return 2;\n    if(right >= TOTAL - 4) return 1;\n    return 0;\n  }\n\n  function finish(){\n    var stars = starsFor(state.right);\n    saveBest(stars);\n    toShell({ kg:\"best\", game:\"coins\", stars:stars });\n    $(\"#bigStars\").innerHTML = [0,1,2].map(function(i){\n      return '<span class=\"' + (i < stars ? \"\" : \"off\") + '\">★<\/span>';\n    }).join(\"\");\n    $(\"#medal\").textContent = stars === 3 ? \"🏆\" : stars === 2 ? \"🎖️\" : stars === 1 ? \"🌟\" : \"💪\";\n    var msg = stars === 3 ? \"Every till perfect!\" : stars === 2 ? \"Great counting!\" : stars === 1 ? \"Good job!\" : \"Keep practising!\";\n    $(\"#resultLine\").innerHTML = msg + \" You paid <b>\" + state.right + \"<\/b> of \" + TOTAL + \" right.\";\n    show(\"done\");\n    if(stars >= 2) sWin();\n  }\n\n  /* ---------------- wiring ---------------- */\n  Array.prototype.forEach.call(document.querySelectorAll(\".level\"), function(b){\n    b.addEventListener(\"click\", function(){\n      audio(); sTap();\n      startGame(b.dataset.level);\n    });\n  });\n  $(\"#back\").addEventListener(\"click\", function(){ sTap(); show(\"home\"); });\n  $(\"#allGames\").addEventListener(\"click\", function(){\n    sTap();\n    if(embedded){ toShell({kg:\"home\"}); } else { location.href = \"index.html\"; }\n  });\n  $(\"#again\").addEventListener(\"click\", function(){ sTap(); startGame(state.level); });\n  $(\"#change\").addEventListener(\"click\", function(){ sTap(); show(\"home\"); });\n  $(\"#mute\").addEventListener(\"click\", function(){\n    muted = !muted;\n    store.set(\"kg.mute\", muted ? \"1\" : \"0\");\n    syncMute();\n    if(!muted) sTap();\n  });\n  $(\"#undo\").addEventListener(\"click\", function(){\n    if(state.locked || !state.added.length) return;\n    sTap();\n    state.added.pop();\n    paintTill();\n  });\n  $(\"#clear\").addEventListener(\"click\", function(){\n    if(state.locked) return;\n    sTap();\n    state.added = [];\n    paintTill();\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "clock": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"theme-color\" content=\"#2A2350\">\n<title>Clockwork<\/title>\n<style>\n  :root{\n    --ink:#1b1730;\n    --deep:#2A2350;\n    --gold:#FFD24A;\n    --mint:#7BE3C0;\n    --coral:#FF6B5A;\n    --white:#FFFDF7;\n    --face:#FFF9EC;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:var(--deep);color:var(--white);\n    font-family:ui-rounded,\"SF Pro Rounded\",-apple-system,system-ui,\"Segoe UI\",sans-serif;\n    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;\n    -webkit-tap-highlight-color:transparent;\n    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;\n  }\n  body::before{\n    content:\"\";position:fixed;inset:0;pointer-events:none;\n    background:\n      radial-gradient(50vw 40vh at 100% 0%, rgba(255,210,74,.13), transparent 70%),\n      radial-gradient(45vw 40vh at 0% 100%, rgba(123,227,192,.12), transparent 70%);\n  }\n  #app{position:relative;height:100%;height:100dvh}\n  .screen{display:none;height:100%;flex-direction:column;padding:\n      calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px)\n      calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 18px);}\n  .screen.active{display:flex}\n  #home{justify-content:center;align-items:center;gap:clamp(10px,2.2vh,22px);text-align:center}\n  .logo{font-size:clamp(44px,9vmin,84px);line-height:1}\n  h1{font-size:clamp(32px,7vmin,68px);font-weight:800;letter-spacing:-.03em;line-height:.95}\n  h1 em{font-style:normal;color:var(--gold)}\n  .sub{font-size:clamp(15px,2.4vmin,22px);font-weight:700;color:#bcb4e8;max-width:26ch}\n  .levels{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);width:min(560px,100%);margin-top:clamp(4px,1.4vh,14px)}\n  .level{\n    display:flex;align-items:center;gap:clamp(12px,2.6vmin,22px);text-align:left;cursor:pointer;\n    background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.22);color:var(--white);\n    border-radius:24px;padding:clamp(12px,2vh,20px) clamp(14px,2.6vmin,24px);font-family:inherit;\n    transition:transform .12s ease, background .15s ease;\n  }\n  .level:active{transform:scale(.98);background:rgba(255,255,255,.14)}\n  .level .big{font-size:clamp(30px,6vmin,52px);line-height:1}\n  .level .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}\n  .level .t b{font-size:clamp(19px,3.2vmin,30px);font-weight:800;letter-spacing:-.01em}\n  .level .t span{font-size:clamp(13px,2vmin,18px);font-weight:700;color:#bcb4e8}\n  .level .go{font-size:clamp(24px,4vmin,36px);color:var(--gold)}\n  .hint{font-size:clamp(12px,1.8vmin,16px);font-weight:600;color:#9d94cf}\n  .allgames{\n    margin-top:2px;font-family:inherit;font-weight:800;font-size:clamp(13px,2vmin,17px);\n    color:inherit;opacity:.7;background:transparent;border:2px solid rgba(255,255,255,.18);\n    border-radius:999px;padding:.4em .95em;cursor:pointer;\n  }\n  .allgames:active{opacity:1;background:rgba(255,255,255,.12)}\n\n  #game{gap:clamp(6px,1.4vh,14px)}\n  .bar{display:flex;align-items:center;gap:clamp(8px,1.6vmin,16px);flex:0 0 auto}\n  .icon{\n    width:clamp(44px,7vmin,58px);height:clamp(44px,7vmin,58px);display:grid;place-items:center;\n    border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);\n    color:var(--white);font-size:clamp(20px,3.4vmin,26px);cursor:pointer;font-family:inherit;\n  }\n  .icon:active{background:rgba(255,255,255,.2)}\n  .dots{display:flex;gap:clamp(4px,.9vmin,8px);flex:1;justify-content:center}\n  .dots i{width:clamp(9px,1.5vmin,14px);height:clamp(9px,1.5vmin,14px);border-radius:50%;background:rgba(255,255,255,.18);transition:background .2s, transform .2s}\n  .dots i.done{background:var(--mint)}\n  .dots i.now{background:var(--gold);transform:scale(1.35)}\n  .score{font-weight:800;font-size:clamp(15px,2.6vmin,22px);background:rgba(255,255,255,.08);\n         border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:.2em .7em;white-space:nowrap}\n\n  .q{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1vh,12px);text-align:center}\n  .task{font-size:clamp(15px,2.6vmin,23px);font-weight:800;color:#bcb4e8;max-width:30ch}\n  .task b{color:var(--gold)}\n  .clockwrap{flex:0 0 auto;display:grid;place-items:center;min-height:0}\n  svg.clock{width:min(42vh,340px,42vmin);height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}\n\n  .answers{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6vmin,16px);width:min(660px,100%);margin:0 auto}\n  .ans{\n    font-family:inherit;font-size:clamp(24px,5vmin,44px);font-weight:800;font-variant-numeric:tabular-nums;\n    color:var(--ink);background:var(--white);border:3px solid var(--ink);border-bottom-width:7px;\n    border-radius:clamp(14px,2.4vmin,22px);padding:clamp(8px,1.8vh,20px) 6px;min-height:clamp(60px,11vh,110px);\n    cursor:pointer;display:grid;place-items:center;transition:transform .1s ease, background .15s ease;\n  }\n  .ans:active{transform:translateY(4px);border-bottom-width:3px}\n  .ans.ok{background:var(--mint);border-color:#0d5c42}\n  .ans.bad{background:var(--coral);border-color:#7a1e12;color:#fff}\n  .ans.dim{opacity:.35}\n  @media (orientation:portrait){ .answers{grid-template-columns:1fr} }\n\n  #done{justify-content:center;align-items:center;gap:clamp(10px,2vh,22px);text-align:center}\n  .medal{font-size:clamp(64px,15vmin,140px);line-height:1;animation:bob 2.4s ease-in-out infinite}\n  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\n  .big-stars{font-size:clamp(34px,8vmin,72px);letter-spacing:.08em;color:var(--gold)}\n  .big-stars .off{opacity:.2}\n  .result-line{font-size:clamp(19px,3.4vmin,32px);font-weight:800;color:#d9d3f5}\n  .result-line b{color:var(--gold)}\n  .btns{display:flex;flex-direction:column;gap:12px;width:min(420px,100%);margin-top:6px}\n  .btn{font-family:inherit;font-size:clamp(18px,3vmin,26px);font-weight:800;padding:clamp(12px,2.2vh,20px) 24px;\n       border-radius:20px;cursor:pointer;border:3px solid var(--ink);border-bottom-width:7px;background:var(--gold);color:var(--ink)}\n  .btn:active{transform:translateY(3px);border-bottom-width:3px}\n  .btn.ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.3)}\n  .praise{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;\n          font-size:clamp(48px,14vmin,140px);font-weight:800;color:var(--gold);\n          text-shadow:0 6px 0 rgba(0,0,0,.25);opacity:0;transform:scale(.6)}\n  .praise.show{animation:pop .8s ease forwards}\n  @keyframes pop{\n    0%{opacity:0;transform:scale(.5) rotate(-6deg)}35%{opacity:1;transform:scale(1.08) rotate(2deg)}\n    70%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1.05) translateY(-24px)}\n  }\n  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}\n  @media (max-height:560px){\n    svg.clock{width:min(34vh,240px)}\n    .ans{min-height:clamp(48px,14vh,80px);font-size:clamp(20px,4.4vmin,32px)}\n    .task{font-size:clamp(13px,2.2vmin,18px)}\n  }\n<\/style>\n<\/head>\n<body>\n<div id=\"app\">\n\n  <section class=\"screen active\" id=\"home\">\n    <div class=\"logo\">🕰️<\/div>\n    <h1>Clock<em>work<\/em><\/h1>\n    <p class=\"sub\">Read the clock. Work out the time.<\/p>\n    <div class=\"levels\">\n      <button class=\"level\" data-level=\"little\">\n        <span class=\"big\">🐣<\/span>\n        <span class=\"t\"><b>Read the Clock<\/b><span>o'clock, half past, quarter past<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n      <button class=\"level\" data-level=\"big\">\n        <span class=\"big\">🦊<\/span>\n        <span class=\"t\"><b>Time Puzzles<\/b><span>elapsed time &middot; 24-hour &middot; am/pm<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n    <\/div>\n    <p class=\"hint\">The hour hand creeps forward as the minutes pass — watch it.<\/p>\n    <button class=\"allgames\" id=\"allGames\">⌂ All games<\/button>\n  <\/section>\n\n  <section class=\"screen\" id=\"game\">\n    <div class=\"bar\">\n      <button class=\"icon\" id=\"back\" aria-label=\"Back\">←<\/button>\n      <div class=\"dots\" id=\"dots\" aria-hidden=\"true\"><\/div>\n      <div class=\"score\" id=\"score\">0<\/div>\n      <button class=\"icon\" id=\"mute\" aria-label=\"Sound\">🔊<\/button>\n    <\/div>\n    <div class=\"q\">\n      <div class=\"task\" id=\"task\"><\/div>\n      <div class=\"clockwrap\" id=\"clockwrap\"><\/div>\n    <\/div>\n    <div class=\"answers\" id=\"answers\"><\/div>\n  <\/section>\n\n  <section class=\"screen\" id=\"done\">\n    <div class=\"medal\" id=\"medal\">🏆<\/div>\n    <div class=\"big-stars\" id=\"bigStars\"><\/div>\n    <div class=\"result-line\" id=\"resultLine\"><\/div>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"again\">Play again<\/button>\n      <button class=\"btn ghost\" id=\"change\">Change level<\/button>\n    <\/div>\n  <\/section>\n\n<\/div>\n<div class=\"praise\" id=\"praise\"><\/div>\n\n<script>\n(function(){\n  \"use strict\";\n  var $ = function(s){ return document.querySelector(s); };\n  var store = {\n    get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },\n    set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }\n  };\n  var embedded = (function(){ try { return window.parent && window.parent !== window; } catch(e){ return false; } })();\n  function toShell(msg){ try { if(embedded) parent.postMessage(msg, \"*\"); } catch(e){} }\n\n  var ri = function(a,b){ return Math.floor(Math.random()*(b-a+1))+a; };\n  var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };\n  function shuffle(a){\n    a = a.slice();\n    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n    return a;\n  }\n\n  /* ---------------- sound ---------------- */\n  var ac = null, muted = store.get(\"kg.mute\") === \"1\";\n  function audio(){\n    if(!ac){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) ac = new AC(); }\n    if(ac && ac.state === \"suspended\") ac.resume();\n    return ac;\n  }\n  function tone(freq, dur, type, vol, delay){\n    if(muted) return;\n    var ctx = audio(); if(!ctx) return;\n    var t0 = ctx.currentTime + (delay || 0);\n    var o = ctx.createOscillator(), g = ctx.createGain();\n    o.type = type || \"sine\"; o.frequency.setValueAtTime(freq, t0);\n    g.gain.setValueAtTime(0, t0);\n    g.gain.linearRampToValueAtTime(vol == null ? .14 : vol, t0 + .012);\n    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);\n    o.connect(g); g.connect(ctx.destination);\n    o.start(t0); o.stop(t0 + dur + .02);\n  }\n  function sTap(){ tone(520,.06,\"triangle\",.06,0); }\n  function tick(){ tone(1500,.03,\"square\",.035,0); }\n  function sRight(){ tone(660,.12,\"sine\",.13,0); tone(990,.16,\"sine\",.11,.09); }\n  function sWrong(){ tone(240,.18,\"triangle\",.10,0); tone(180,.22,\"triangle\",.09,.12); }\n  function sWin(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.24,\"sine\",.12,i*.11); }); }\n  function syncMute(){ $(\"#mute\").textContent = muted ? \"🔇\" : \"🔊\"; }\n  syncMute();\n\n  var BEST = \"kg.best.clock\";\n  function bestOf(){ return parseInt(store.get(BEST) || \"0\", 10) || 0; }\n  function saveBest(v){ if(v > bestOf()) store.set(BEST, String(v)); }\n\n  /* ---------------- clock drawing ---------------- */\n  function fmt(h24, m){\n    var h = h24 % 12; if(h === 0) h = 12;\n    return h + \":\" + (m < 10 ? \"0\" : \"\") + m;\n  }\n  function fmt24(h24, m){ return (h24 < 10 ? \"0\" : \"\") + h24 + \":\" + (m < 10 ? \"0\" : \"\") + m; }\n\n  /* h24 = hour on a 12-hour face (0..23), m = minutes */\n  function clockSVG(h12, m){\n    var R = 100, cx = 110, cy = 110;\n    var svg = '<svg class=\"clock\" viewBox=\"0 0 220 220\" role=\"img\" aria-label=\"clock\">';\n    svg += '<circle cx=\"110\" cy=\"110\" r=\"104\" fill=\"#2A2350\"/>';\n    svg += '<circle cx=\"110\" cy=\"110\" r=\"98\" fill=\"#FFF9EC\"/>';\n    // minute ticks\n    for(var i = 0; i < 60; i++){\n      var a = i * Math.PI / 30, inner = (i % 5 === 0) ? 82 : 88, outer = 94;\n      svg += '<line x1=\"' + (110 + Math.sin(a) * inner).toFixed(1) + '\" y1=\"' + (110 - Math.cos(a) * inner).toFixed(1) +\n             '\" x2=\"' + (110 + Math.sin(a) * outer).toFixed(1) + '\" y2=\"' + (110 - Math.cos(a) * outer).toFixed(1) +\n             '\" stroke=\"' + (i % 5 === 0 ? '#5b5285' : '#c9c2ab') + '\" stroke-width=\"' + (i % 5 === 0 ? 3 : 1.6) + '\" stroke-linecap=\"round\"/>';\n    }\n    // numbers\n    for(var n = 1; n <= 12; n++){\n      var ang = n * Math.PI / 6;\n      svg += '<text x=\"' + (110 + Math.sin(ang) * 68).toFixed(1) + '\" y=\"' + (110 - Math.cos(ang) * 68 + 9).toFixed(1) +\n             '\" text-anchor=\"middle\" font-size=\"24\" font-weight=\"800\" fill=\"#2A2350\" font-family=\"ui-rounded, system-ui\">' + n + '<\/text>';\n    }\n    // hour hand: creeps with the minutes\n    var ha = ((h12 % 12) + m / 60) * Math.PI / 6;\n    // minute hand\n    var ma = m * Math.PI / 30;\n    svg += '<line x1=\"110\" y1=\"110\" x2=\"' + (110 + Math.sin(ha) * 44).toFixed(1) + '\" y2=\"' + (110 - Math.cos(ha) * 44).toFixed(1) +\n           '\" stroke=\"#2A2350\" stroke-width=\"11\" stroke-linecap=\"round\"/>';\n    svg += '<line x1=\"110\" y1=\"110\" x2=\"' + (110 + Math.sin(ma) * 70).toFixed(1) + '\" y2=\"' + (110 - Math.cos(ma) * 70).toFixed(1) +\n           '\" stroke=\"#E4572E\" stroke-width=\"6\" stroke-linecap=\"round\"/>';\n    svg += '<circle cx=\"110\" cy=\"110\" r=\"7\" fill=\"#2A2350\"/><circle cx=\"110\" cy=\"110\" r=\"3\" fill=\"#FFD24A\"/>';\n    svg += '<\/svg>';\n    return svg;\n  }\n\n  function choicesFor(answer, wrongs, max){\n    var cap = max == null ? 1439 : max, out = [answer];\n    wrongs.forEach(function(w){\n      if(out.length < 4 && w >= 0 && w <= cap && out.indexOf(w) === -1) out.push(w);\n    });\n    var guard = 0;\n    while(out.length < 4 && guard++ < 80){\n      var w = answer + pick([-20,-10,10,20,-60,60,-120,120]);\n      if(w >= 0 && w <= cap && out.indexOf(w) === -1) out.push(w);\n    }\n    return shuffle(out);\n  }\n\n  var TOTAL = 8;\n  var state = { level:\"little\", i:0, right:0, locked:false, round:[] };\n\n  /* times as minutes since midnight, so arithmetic is trivial */\n  function makeQuestion(level){\n    if(level === \"little\"){\n      var h = ri(1,12), m = pick([0,0,30,30,15,45,0,30]);\n      var total = h * 60 + m;\n      var wrongs = [total + 60, total - 60, total + 30, total - 30, (m === 0 ? h*60 + 30 : h*60)];\n      return {\n        clock: { h: h % 12, m: m },\n        task: m === 0 ? \"What time is it?\" : \"What time is it?\",\n        answer: total,\n        choices: choicesFor(total, wrongs),\n        say: \"What time is it?\"\n      };\n    }\n    var kind = pick([\"elapsed\",\"elapsed\",\"to24\",\"to12\"]);\n    if(kind === \"elapsed\"){\n      var sh = ri(1,11), sm = pick([0,15,30,45]);\n      var dur = pick([20,30,45,60,75,90,105,120]);\n      var start = sh * 60 + sm;\n      var end = start + dur;\n      return {\n        clock: { h: sh % 12, m: sm },\n        task: \"It is <b>\" + fmt(sh, sm) + \"<\/b>. In <b>\" + dur + \" minutes<\/b> it will be…\",\n        answer: end,\n        choices: choicesFor(end, [end - 60, end + 60, end - 10, end + 10, start + Math.round(dur/2)]),\n        say: dur + \" minutes after \" + fmt(sh, sm)\n      };\n    }\n    if(kind === \"to24\"){\n      var h24 = ri(13,23), mm = pick([0,15,30,45]);\n      var base = h24 * 60 + mm;\n      return {\n        clock: { h: h24 % 12, m: mm },\n        task: \"This is <b>\" + fmt(h24, mm) + \" pm<\/b>. In 24-hour time that is…\",\n        answer: base,\n        choices: choicesFor(base, [base + 720, base - 720, base + 60, base - 60]),\n        say24: true,\n        say: fmt(h24, mm) + \" in the afternoon\"\n      };\n    }\n    var hh = ri(13,23), m2 = pick([0,15,30,45]);\n    var t24 = hh * 60 + m2;\n    return {\n      clock: { h: hh % 12, m: m2 },\n      task: \"24-hour time says <b>\" + fmt24(hh, m2) + \"<\/b>. In the afternoon that is…\",\n      answer: t24,\n      choices: choicesFor(t24, [t24 + 720, t24 - 720, t24 + 60, t24 - 60]),\n      say24: false,\n      say: \"Convert \" + fmt24(hh, m2)\n    };\n  }\n\n  function buildRound(level){\n    var qs = [], seen = {}, guard = 0;\n    while(qs.length < TOTAL && guard++ < 300){\n      var q = makeQuestion(level);\n      if(seen[q.task + q.answer]) continue;\n      seen[q.task + q.answer] = 1;\n      qs.push(q);\n    }\n    return qs;\n  }\n\n  function show(id){\n    Array.prototype.forEach.call(document.querySelectorAll(\".screen\"), function(s){ s.classList.remove(\"active\"); });\n    document.getElementById(id).classList.add(\"active\");\n  }\n\n  function startGame(level){\n    state.level = level; state.round = buildRound(level);\n    state.i = 0; state.right = 0;\n    show(\"game\"); render();\n  }\n\n  function paintDots(){\n    var html = \"\";\n    for(var i=0;i<TOTAL;i++){\n      html += '<i class=\"' + (i < state.i ? \"done\" : (i === state.i ? \"now\" : \"\")) + '\"><\/i>';\n    }\n    $(\"#dots\").innerHTML = html;\n    $(\"#score\").textContent = \"⭐ \" + state.right;\n  }\n\n  function render(){\n    var q = state.round[state.i];\n    state.locked = false;\n    $(\"#task\").innerHTML = q.task;\n    $(\"#clockwrap\").innerHTML = clockSVG(q.clock.h, q.clock.m);\n    var box = $(\"#answers\"); box.innerHTML = \"\";\n    q.choices.forEach(function(v){\n      var b = document.createElement(\"button\");\n      b.type = \"button\"; b.className = \"ans\"; b.dataset.v = String(v);\n      b.textContent = q.say24 ? fmt24(Math.floor(v/60), v % 60) : fmt(Math.floor(v/60), v % 60);\n      b.addEventListener(\"click\", function(){ answer(v, b); });\n      box.appendChild(b);\n    });\n    paintDots();\n  }\n\n  function answer(v, btn){\n    if(state.locked) return;\n    state.locked = true;\n    var q = state.round[state.i];\n    Array.prototype.forEach.call(document.querySelectorAll(\".ans\"), function(b){\n      b.disabled = true;\n      if(Number(b.dataset.v) === q.answer) b.classList.add(\"ok\");\n      else b.classList.add(\"dim\");\n    });\n    if(v === q.answer){\n      state.right++; sRight(); praise();\n      $(\"#score\").textContent = \"⭐ \" + state.right;\n      setTimeout(next, 850);\n    } else {\n      sWrong(); btn.classList.remove(\"dim\"); btn.classList.add(\"bad\");\n      setTimeout(next, 1750);\n    }\n  }\n\n  var PRAISE = [\"Yes!\", \"Sharp!\", \"On time!\", \"🕰️\", \"Nice!\", \"Tick tock!\"];\n  function praise(){\n    var el = $(\"#praise\");\n    el.textContent = pick(PRAISE);\n    el.classList.remove(\"show\"); void el.offsetWidth; el.classList.add(\"show\");\n  }\n\n  function next(){\n    state.i++;\n    if(state.i >= TOTAL){ finish(); return; }\n    render();\n  }\n\n  function starsFor(right){\n    if(right >= TOTAL) return 3;\n    if(right >= TOTAL - 2) return 2;\n    if(right >= TOTAL - 4) return 1;\n    return 0;\n  }\n\n  function finish(){\n    var stars = starsFor(state.right);\n    saveBest(stars);\n    toShell({ kg:\"best\", game:\"clock\", stars:stars });\n    $(\"#bigStars\").innerHTML = [0,1,2].map(function(i){\n      return '<span class=\"' + (i < stars ? \"\" : \"off\") + '\">★<\/span>';\n    }).join(\"\");\n    $(\"#medal\").textContent = stars === 3 ? \"🏆\" : stars === 2 ? \"🎖️\" : stars === 1 ? \"🌟\" : \"💪\";\n    var msg = stars === 3 ? \"Perfect timing!\" : stars === 2 ? \"Great work!\" : stars === 1 ? \"Good job!\" : \"Keep practising!\";\n    $(\"#resultLine\").innerHTML = msg + \" You read <b>\" + state.right + \"<\/b> of \" + TOTAL + \" right.\";\n    show(\"done\");\n    if(stars >= 2) sWin();\n  }\n\n  Array.prototype.forEach.call(document.querySelectorAll(\".level\"), function(b){\n    b.addEventListener(\"click\", function(){ audio(); sTap(); startGame(b.dataset.level); });\n  });\n  $(\"#back\").addEventListener(\"click\", function(){ sTap(); show(\"home\"); });\n  $(\"#allGames\").addEventListener(\"click\", function(){\n    sTap();\n    if(embedded){ toShell({kg:\"home\"}); } else { location.href = \"index.html\"; }\n  });\n  $(\"#again\").addEventListener(\"click\", function(){ sTap(); startGame(state.level); });\n  $(\"#change\").addEventListener(\"click\", function(){ sTap(); show(\"home\"); });\n  $(\"#mute\").addEventListener(\"click\", function(){\n    muted = !muted; store.set(\"kg.mute\", muted ? \"1\" : \"0\"); syncMute(); if(!muted) sTap();\n  });\n  document.addEventListener(\"click\", function(e){ if(e.target.closest(\".ans\")) tick(); });\n})();\n<\/script>\n<\/body>\n<\/html>\n"};

var stage = document.getElementById("stage"),
    frame = document.getElementById("frame");

var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

function paintStars(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-stars]"), function(el){
    var n = parseInt(store.get("kg.best." + el.dataset.stars) || "0", 10) || 0;
    el.innerHTML = [0,1,2].map(function(i){
      return '<span class="' + (i < n ? "" : "off") + '">\u2605</span>';
    }).join("");
  });
}

function openGame(key){
  if(!GAMES[key]) return;
  frame.setAttribute("srcdoc", GAMES[key]);
  stage.classList.add("on");
}

function goHome(){
  stage.classList.remove("on");
  frame.removeAttribute("srcdoc");
  paintStars();
}

Array.prototype.forEach.call(document.querySelectorAll(".game"), function(btn){
  btn.addEventListener("click", function(){ openGame(btn.dataset.game); });
});

addEventListener("message", function(e){
  var d = e.data || {};
  if(!d || !d.kg) return;
  if(d.kg === "home"){ goHome(); return; }
  if(d.kg === "best" && d.game){
    var k = "kg.best." + d.game;
    var prev = parseInt(store.get(k) || "0", 10) || 0;
    if(d.stars > prev) store.set(k, String(d.stars));
    paintStars();
  }
});

paintStars();
</script>
</body>
</html>
