<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBF3E4">
<title>Playroom</title>
<style>
  :root{--ink:#22242c;--paper:#FBF3E4;--math:#2F6BFF;--quiz:#F97B22;--word:#1FA36B}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60vw 50vh at 8% 0%, rgba(47,107,255,.10), transparent 70%),
      radial-gradient(55vw 45vh at 96% 100%, rgba(249,123,34,.12), transparent 70%);
  }
  .wrap{
    position:relative;height:100%;height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 22px) calc(env(safe-area-inset-right) + 26px)
            calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 26px);
    gap:clamp(12px,2.4vh,26px);
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-size:clamp(34px,6.4vmin,64px);letter-spacing:-.02em;line-height:.95;font-weight:800}
  h1 span{color:var(--quiz)}
  .tagline{font-size:clamp(14px,2.1vmin,20px);font-weight:600;color:#6b6257;padding-bottom:.5em}
  .games{
    flex:1;min-height:0;max-height:min(62vh,540px);margin:auto 0;
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vmin,28px);
  }
  .game{
    position:relative;display:flex;flex-direction:column;justify-content:flex-end;
    text-align:left;font-family:inherit;cursor:pointer;color:inherit;
    border-radius:clamp(20px,3vmin,32px);border:3px solid var(--ink);background:#fff;
    box-shadow:0 clamp(6px,1.2vmin,10px) 0 rgba(34,36,44,.9);
    padding:clamp(14px,2.4vmin,26px);gap:4px;overflow:hidden;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .game:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(34,36,44,.9)}
  .game::before{content:"";position:absolute;inset:0;background:var(--tint);opacity:.14;z-index:0}
  .game > *{position:relative;z-index:1}
  .art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(48px,10vmin,100px);line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
  .name{font-size:clamp(20px,3.2vmin,32px);font-weight:800;letter-spacing:-.01em}
  .meta{font-size:clamp(12px,1.8vmin,17px);font-weight:700;color:#6b6257;display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
  .play{margin-top:4px;align-self:flex-start;display:inline-block;font-size:clamp(14px,2.1vmin,19px);font-weight:800;color:#fff;background:var(--tint);border:3px solid var(--ink);border-radius:999px;padding:.24em .95em;box-shadow:0 4px 0 var(--ink)}
  .stars{font-size:clamp(14px,2vmin,19px);letter-spacing:.06em;white-space:nowrap}
  .stars .off{opacity:.22}
  footer{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(11px,1.6vmin,14px);font-weight:700;color:#8a8073}
  .dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#8a8073;margin:0 .35em .08em}

  #stage{
    position:fixed;inset:0;display:none;z-index:50;background:#0d1116;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #stage.on{display:block}
  #frame{width:100%;height:100%;border:0;display:block;background:#0d1116}

  @media (max-width:900px) and (orientation:portrait){
    .games{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);max-height:none;margin:0;flex:1}
    .game{flex-direction:row;align-items:center;justify-content:flex-start;gap:clamp(12px,3vmin,22px)}
    .art{flex:0 0 auto;font-size:clamp(44px,11vmin,86px)}
    .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
    .name{font-size:clamp(20px,3.4vmin,32px)}
    .meta{flex-direction:column;align-items:flex-start;gap:2px}
    .play{margin-top:0}
  }
  @media (max-height:520px){
    h1{font-size:clamp(26px,5vmin,40px)}
    .tagline{display:none}
    .art{font-size:clamp(34px,9vmin,64px)}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Playroom">
<meta name="robots" content="noindex,nofollow">
<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Play<span>room</span></h1>
    <div class="tagline">Pick a game. Tap to play.</div>
  </header>

  <main class="games">
    <button class="game" data-game="math" style="--tint:#2F6BFF">
      <div class="art">🔢</div>
      <div class="txt">
        <div class="name">Math Quest</div>
        <div class="meta"><span>Numbers &middot; 4&ndash;9</span><span class="stars" data-stars="math"></span></div>
        <span class="play">Play</span>
      </div>
    </button>

    <button class="game" data-game="quiz" style="--tint:#F97B22">
      <div class="art">🦁</div>
      <div class="txt">
        <div class="name">Quiz Safari</div>
        <div class="meta"><span>Know-how &middot; 4&ndash;9</span><span class="stars" data-stars="quiz"></span></div>
        <span class="play">Play</span>
      </div>
    </button>

    <button class="game" data-game="word" style="--tint:#1FA36B">
      <div class="art">🌱</div>
      <div class="txt">
        <div class="name">Word Garden</div>
        <div class="meta"><span>Crossword &middot; 5&ndash;9</span><span class="stars" data-stars="word"></span></div>
        <span class="play">Play</span>
      </div>
    </button>
  </main>

  <footer>
    <span>Three games<span class="dot"></span>works offline</span>
    <span>Made for iPad</span>
  </footer>
</div>

<div id="stage"><iframe id="frame" title="Game"></iframe></div>

<script>
var GAMES = {"math": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"theme-color\" content=\"#0E3B43\">\n<title>Math Quest<\/title>\n<style>\n  :root{\n    --ink:#12232b;\n    --deep:#0E3B43;\n    --deep2:#0a2c33;\n    --sun:#FFD24A;\n    --mint:#5FE0B0;\n    --coral:#FF6B5A;\n    --white:#FFFDF7;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{height:100%}\n  body{\n    background:var(--deep);\n    color:var(--white);\n    font-family:ui-rounded,\"SF Pro Rounded\",-apple-system,system-ui,\"Segoe UI\",sans-serif;\n    -webkit-user-select:none;user-select:none;\n    -webkit-touch-callout:none;\n    -webkit-tap-highlight-color:transparent;\n    overflow:hidden;overscroll-behavior:none;touch-action:manipulation;\n  }\n  body::before{\n    content:\"\";position:fixed;inset:0;pointer-events:none;\n    background:\n      radial-gradient(50vw 40vh at 100% 0%, rgba(95,224,176,.14), transparent 70%),\n      radial-gradient(45vw 40vh at 0% 100%, rgba(255,210,74,.10), transparent 70%);\n  }\n  #app{position:relative;height:100%;height:100dvh}\n  .screen{display:none;height:100%;flex-direction:column;padding:\n      calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 18px)\n      calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 18px);}\n  .screen.active{display:flex}\n\n  /* ---------- home ---------- */\n  #home{justify-content:center;align-items:center;gap:clamp(10px,2.2vh,22px);text-align:center}\n  .logo{font-size:clamp(44px,9vmin,84px);line-height:1}\n  h1{font-size:clamp(34px,7.4vmin,72px);font-weight:800;letter-spacing:-.03em;line-height:.95}\n  h1 em{font-style:normal;color:var(--sun)}\n  .sub{font-size:clamp(15px,2.4vmin,22px);font-weight:700;color:#9fd0cd;max-width:26ch}\n  .levels{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);width:min(560px,100%);margin-top:clamp(4px,1.4vh,14px)}\n  .level{\n    display:flex;align-items:center;gap:clamp(12px,2.6vmin,22px);\n    text-align:left;cursor:pointer;\n    background:rgba(255,255,255,.07);\n    border:3px solid rgba(255,255,255,.22);\n    color:var(--white);\n    border-radius:24px;\n    padding:clamp(12px,2vh,20px) clamp(14px,2.6vmin,24px);\n    font-family:inherit;\n    transition:transform .12s ease, background .15s ease;\n  }\n  .level:active{transform:scale(.98);background:rgba(255,255,255,.14)}\n  .level .big{font-size:clamp(30px,6vmin,52px);line-height:1}\n  .level .t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}\n  .level .t b{font-size:clamp(19px,3.2vmin,30px);font-weight:800;letter-spacing:-.01em}\n  .level .t span{font-size:clamp(13px,2vmin,18px);font-weight:700;color:#9fd0cd}\n  .level .go{font-size:clamp(24px,4vmin,36px);color:var(--sun)}\n  .hint{font-size:clamp(12px,1.8vmin,16px);font-weight:600;color:#7fb2af}\n\n  /* ---------- game ---------- */\n  #game{gap:clamp(8px,1.8vh,18px)}\n  .bar{display:flex;align-items:center;gap:clamp(8px,1.6vmin,16px);flex:0 0 auto}\n  .icon{\n    width:clamp(44px,7vmin,58px);height:clamp(44px,7vmin,58px);\n    display:grid;place-items:center;\n    border-radius:16px;border:2px solid rgba(255,255,255,.25);\n    background:rgba(255,255,255,.08);color:var(--white);\n    font-size:clamp(20px,3.4vmin,26px);cursor:pointer;font-family:inherit;\n  }\n  .icon:active{background:rgba(255,255,255,.2)}\n  .dots{display:flex;gap:clamp(4px,.9vmin,8px);flex:1;justify-content:center}\n  .dots i{\n    width:clamp(9px,1.5vmin,14px);height:clamp(9px,1.5vmin,14px);border-radius:50%;\n    background:rgba(255,255,255,.18);transition:background .2s, transform .2s;\n  }\n  .dots i.done{background:var(--mint)}\n  .dots i.now{background:var(--sun);transform:scale(1.35)}\n  .score{\n    font-weight:800;font-size:clamp(15px,2.6vmin,22px);\n    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);\n    border-radius:999px;padding:.2em .7em;white-space:nowrap;\n  }\n\n  .q{\n    flex:1;min-height:0;\n    display:flex;flex-direction:column;align-items:center;justify-content:center;\n    gap:clamp(6px,1.6vh,18px);\n    text-align:center;\n  }\n  .visual{\n    display:flex;flex-wrap:wrap;justify-content:center;align-items:center;\n    gap:clamp(2px,.8vmin,10px);\n    font-size:clamp(34px,8.4vmin,88px);line-height:1;\n    max-width:min(90vw,900px);\n    min-height:1em;\n  }\n  .visual .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(2px,.6vmin,8px);padding:0 clamp(4px,.9vmin,10px)}\n  .visual .op{font-size:.62em;font-weight:800;color:var(--sun);padding:0 clamp(2px,.8vmin,8px)}\n  .visual .x{opacity:.3;text-decoration:line-through}\n  .prompt{\n    font-size:clamp(40px,10vmin,110px);\n    font-weight:800;letter-spacing:-.03em;line-height:1.02;\n    font-variant-numeric:tabular-nums;\n  }\n  .prompt .gap{color:var(--sun)}\n\n  .answers{\n    flex:0 0 auto;\n    display:grid;grid-template-columns:1fr 1fr;\n    gap:clamp(8px,1.6vmin,16px);\n    width:min(720px,100%);margin:0 auto;\n  }\n  .ans{\n    font-family:inherit;\n    font-size:clamp(30px,6.4vmin,64px);\n    font-weight:800;font-variant-numeric:tabular-nums;\n    color:var(--ink);\n    background:var(--white);\n    border:3px solid var(--ink);\n    border-bottom-width:7px;\n    border-radius:clamp(16px,2.6vmin,24px);\n    padding:clamp(8px,2.2vh,26px) 8px;\n    min-height:clamp(72px,13vh,150px);\n    cursor:pointer;\n    transition:transform .1s ease, background .15s ease, border-color .15s ease;\n    display:grid;place-items:center;\n  }\n  .ans:active{transform:translateY(4px);border-bottom-width:3px}\n  .ans.ok{background:var(--mint);border-color:#0d5c42}\n  .ans.bad{background:var(--coral);border-color:#7a1e12;color:#fff;animation:shake .4s}\n  .ans.dim{opacity:.35}\n  .ans[disabled]{cursor:default}\n  @keyframes shake{\n    0%,100%{transform:translateX(0)}\n    20%{transform:translateX(-8px)}\n    40%{transform:translateX(8px)}\n    60%{transform:translateX(-5px)}\n    80%{transform:translateX(5px)}\n  }\n  .praise{\n    position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;\n    font-size:clamp(48px,14vmin,140px);font-weight:800;color:var(--sun);\n    text-shadow:0 6px 0 rgba(0,0,0,.25);\n    opacity:0;transform:scale(.6);\n  }\n  .praise.show{animation:pop .8s ease forwards}\n  @keyframes pop{\n    0%{opacity:0;transform:scale(.5) rotate(-6deg)}\n    35%{opacity:1;transform:scale(1.08) rotate(2deg)}\n    70%{opacity:1;transform:scale(1) rotate(0)}\n    100%{opacity:0;transform:scale(1.05) translateY(-24px)}\n  }\n\n  /* ---------- done ---------- */\n  #done{justify-content:center;align-items:center;gap:clamp(10px,2vh,22px);text-align:center}\n  .medal{font-size:clamp(64px,15vmin,140px);line-height:1;animation:bob 2.4s ease-in-out infinite}\n  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}\n  .big-stars{font-size:clamp(34px,8vmin,72px);letter-spacing:.08em;color:var(--sun)}\n  .big-stars .off{opacity:.2}\n  .result-line{font-size:clamp(19px,3.4vmin,32px);font-weight:800;color:#cfeae7}\n  .result-line b{color:var(--sun)}\n  .btns{display:flex;flex-direction:column;gap:12px;width:min(420px,100%);margin-top:6px}\n  .btn{\n    font-family:inherit;font-size:clamp(18px,3vmin,26px);font-weight:800;\n    padding:clamp(12px,2.2vh,20px) 24px;border-radius:20px;cursor:pointer;\n    border:3px solid var(--ink);border-bottom-width:7px;\n    background:var(--sun);color:var(--ink);\n  }\n  .btn:active{transform:translateY(3px);border-bottom-width:3px}\n  .btn.ghost{background:transparent;color:var(--white);border-color:rgba(255,255,255,.3)}\n  #fx{position:fixed;inset:0;pointer-events:none;z-index:9}\n  .allgames{\n    margin-top:2px;font-family:inherit;font-weigh n  <section class=\"screen active\" id=\"home\">\n    <div class=\"logo\">🦁<\/div>\n    <h1>Quiz <em>Safari<\/em><\/h1>\n    <p class=\"sub\">Tap the answer. Find out something new.<\/p>\n    <div class=\"levels\">\n      <button class=\"level\" data-level=\"little\">\n        <span class=\"big\">🐣<\/span>\n        <span class=\"t\"><b>Little Explorer<\/b><span>pictures, animals, colours &middot; read aloud<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n      <button class=\"level\" data-level=\"big\">\n        <span class=\"big\">🦊<\/span>\n        <span class=\"t\"><b>Big Explorer<\/b><span>space, science, geography &middot; real facts<\/span><\/span>\n        <span class=\"go\">▶<\/span>\n      <\/button>\n    <\/div>\n    <p class=\"hint\">Little Explorer reads every question out loud — no reading needed.<\/p>\n    <button class=\"allgames\" id=\"allGames\">⌂ All games<\/button>\n  <\/section>\n\n  <section class=\"screen\" id=\"game\">\n    <div class=\"bar\">\n      <button class=\"icon\" id=\"back\" aria-label=\"Back\">←<\/button>\n      <div class=\"dots\" id=\"dots\" aria-hidden=\"true\"><\/div>\n      <div class=\"score\" id=\"score\">0<\/div>\n      <button class=\"icon\" id=\"mute\" aria-label=\"Sound\">🔊<\/button>\n    <\/div>\n    <div class=\"stage\">\n      <div class=\"qcard\" id=\"qcard\">\n        <div class=\"art\" id=\"qart\"><\/div>\n        <div class=\"qtext\" id=\"qtext\"><\/div>\n        <button class=\"speak\" id=\"speak\" aria-label=\"Read the question out loud\">🔊<\/button>\n      <\/div>\n      <div class=\"answers\" id=\"answers\"><\/div>\n      <div class=\"fact\" id=\"fact\">\n        <div class=\"fx\" id=\"factIcon\">💡<\/div>\n        <div class=\"ft\" id=\"factText\"><\/div>\n        <button class=\"next\" id=\"next\">Next →<\/button>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"screen\" id=\"done\">\n    <div class=\"medal\" id=\"medal\">🏆<\/div>\n    <div class=\"big-stars\" id=\"bigStars\"><\/div>\n    <div class=\"result-line\" id=\"resultLine\"><\/div>\n    <div class=\"btns\">\n      <button class=\"btn\" id=\"again\">Play again<\/button>\n      <button class=\"btn ghost\" id=\"change\">Change level<\/button>\n    <\/div>\n  <\/section>\n\n<\/div>\n<canvas id=\"fx\"><\/canvas>\n\n<script>\n(function(){\n  \"use strict\";\n\n  var $ = function(s){ return document.querySelector(s); };\n  var store = {\n    get: function(k){ try { return store.get(k); } catch(e){ return null; } },\n    set: function(k,v){ try { store.set(k,v); } catch(e){} }\n  };\n  var embedded = (function(){ try { return window.parent && window.parent !== window; } catch(e){ return false; } })();\n  function toShell(msg){ try { if(embedded) parent.postMessage(msg, \"*\"); } catch(e){} }\n\n  var ri = function(a,b){ return Math.floor(Math.random()*(b-a+1))+a; };\n  function shuffle(a){\n    a = a.slice();\n    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n    return a;\n  }\n\n  /* ---------------- questions ---------------- */\n  /* every fact below is a plain, checkable fact - no guesses, no dates to argue about */\n  var LITTLE = [\n    { art:\"🐄\", q:\"Which animal says moo?\",\n      opts:[[\"🐄\",\"Cow\"],[\"🐑\",\"Sheep\"],[\"🐷\",\"Pig\"]], a:\"Cow\",\n      fact:\"Cows moo to keep in touch with the herd.\" },\n    { art:\"🕷️\", q:\"How many legs does a spider have?\",\n      opts:[[\"6\",\"Six\"],[\"8\",\"Eight\"],[\"10\",\"Ten\"]], a:\"Eight\",\n      fact:\"Spiders always have eight legs. Insects have six.\" },\n    { art:\"🍌\", q:\"What colour is a banana when it is ready to eat?\",\n      opts:[[\"🟡\",\"Yellow\"],[\"🔵\",\"Blue\"],[\"🔴\",\"Red\"]], a:\"Yellow\",\n      fact:\"Bananas turn from green to yellow as the sugar builds up.\" },\n    { art:\"🌊\", q:\"Which animal lives in the ocean?\",\n      opts:[[\"🐬\",\"Dolphin\"],[\"🦁\",\"Lion\"],[\"🐪\",\"Camel\"]], a:\"Dolphin\",\n      fact:\"Dolphins breathe air, but they live in the sea.\" },\n    { art:\"🌱\", q:\"What do plants need to grow?\",\n      opts:[[\"💧\",\"Water\"],[\"🍬\",\"Candy\"],[\"🪨\",\"Rocks\"]], a:\"Water\",\n      fact:\"Plants need water, light and air — not candy.\" },\n    { art:\"🚲\", q:\"How many wheels does a bicycle have?\",\n      opts:[[\"2\",\"Two\"],[\"3\",\"Three\"],[\"4\",\"Four\"]], a:\"Two\",\n      fact:\"Two wheels, two pedals, one happy rider.\" },\n    { art:\"🐘\", q:\"Which one is the biggest?\",\n      opts:[[\"🐜\",\"Ant\"],[\"🐘\",\"Elephant\"],[\"🐈\",\"Cat\"]], a:\"Elephant\",\n      fact:\"An elephant can weigh as much as five cars.\" },\n    { art:\"🌧️\", q:\"What falls from clouds when it rains?\",\n      opts:[[\"💧\",\"Raindrops\"],[\"🍂\",\"Leaves\"],[\"🎈\",\"Balloons\"]], a:\"Raindrops\",\n      fact:\"Tiny water drops join together until they are heavy enough to fall.\" },\n    { art:\"🦅\", q:\"Which one can fly?\",\n      opts:[[\"🦅\",\"Eagle\"],[\"🐟\",\"Fish\"],[\"🐢\",\"Turtle\"]], a:\"Eagle\",\n      fact:\"Eagles can spot a rabbit from high up in the sky.\" },\n    { art:\"👀\", q:\"What do you use to see?\",\n      opts:[[\"👂\",\"Ears\"],[\"👀\",\"Eyes\"],[\"👃\",\"Nose\"]], a:\"Eyes\",\n      fact:\"Your eyes send pictures to your brain, very fast.\" },\n    { art:\"🧊\", q:\"Which one is cold?\",\n      opts:[[\"🔥\",\"Fire\"],[\"🧊\",\"Ice\"],[\"☀️\",\"The Sun\"]], a:\"Ice\",\n      fact:\"Ice is water that got so cold it turned solid.\" },\n    { art:\"🐶\", q:\"What sound does a dog make?\",\n      opts:[[\"🐶\",\"Woof\"],[\"🐱\",\"Meow\"],[\"🐸\",\"Ribbit\"]], a:\"Woof\",\n      fact:\"Dogs also bark, whine and howl to talk to us.\" },\n    { art:\"🌈\", q:\"How many colours are in a rainbow?\",\n      opts:[[\"3\",\"Three\"],[\"7\",\"Seven\"],[\"12\",\"Twelve\"]], a:\"Seven\",\n      fact:\"Red, orange, yellow, green, blue, indigo, violet.\" },\n    { art:\"🍎\", q:\"Which one is a fruit?\",\n      opts:[[\"🍎\",\"Apple\"],[\"🥕\",\"Carrot\"],[\"🥔\",\"Potato\"]], a:\"Apple\", n        { w:\"CUP\", r:0, c:0, dir:\"d\", clue:\"You drink from this\", emoji:\"🥤\" },\n        { w:\"PIG\", r:2, c:0, dir:\"a\", clue:\"A pink farm animal\", emoji:\"🐷\" },\n        { w:\"TAG\", r:0, c:2, dir:\"d\", clue:\"A chasing game — you're it!\", emoji:\"🏃\" }\n      ]\n    },\n    big: {\n      name:\"Big Garden\", size:7,\n      words:[\n        { w:\"GRAVITY\", r:0, c:0, dir:\"d\", clue:\"The force that pulls you down to Earth\", emoji:\"🌍\" },\n        { w:\"ROCKET\",  r:1, c:0, dir:\"a\", clue:\"A ship that blasts off into space\", emoji:\"🚀\" },\n        { w:\"COMET\",   r:1, c:2, dir:\"d\", clue:\"A ball of ice and dust with a long tail\", emoji:\"☄️\" },\n        { w:\"MARS\",    r:3, c:2, dir:\"a\", clue:\"The red planet\", emoji:\"🔴\" },\n        { w:\"STAR\",    r:3, c:5, dir:\"d\", clue:\"The Sun is one of these\", emoji:\"⭐\" }\n      ]\n    }\n  };\n\n  /* ---------------- sound ---------------- */\n  var ac = null, muted = store.get(\"kg.mute\") === \"1\";\n  function audio(){\n    if(!ac){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) ac = new AC(); }\n    if(ac && ac.state === \"suspended\") ac.resume();\n    return ac;\n  }\n  function tone(freq,dur,type,vol,delay){\n    if(muted) return;\n    var ctx = audio(); if(!ctx) return;\n    var t0 = ctx.currentTime + (delay||0);\n    var o = ctx.createOscillator(), g = ctx.createGain();\n    o.type = type || \"sine\";\n    o.frequency.setValueAtTime(freq,t0);\n    g.gain.setValueAtTime(0,t0);\n    g.gain.linearRampToValueAtTime(vol==null?.12:vol,t0+.012);\n    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);\n    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0+dur+.02);\n  }\n  function sTap(){ tone(560,.06,\"triangle\",.06,0); }\n  function sKey(){ tone(700,.05,\"triangle\",.05,0); }\n  function sWrong(){ tone(220,.16,\"triangle\",.10,0); tone(170,.2,\"triangle\",.09,.1); }\n  function sWord(){ tone(784,.12,\"sine\",.12,0); tone(1047,.16,\"sine\",.1,.09); }\n  function sWin(){ [523,659,784,1047,1319].forEach(function(f,i){ tone(f,.26,\"sine\",.12,i*.1); }); }\n\n  /* ---------------- speech ---------------- */\n  var speechOK = \"speechSynthesis\" in window;\n  function speak(text){\n    if(!speechOK || muted) return;\n    try{\n      window.speechSynthesis.cancel();\n      var u = new SpeechSynthesisUtterance(text);\n      u.lang = \"en-US\"; u.rate = .9; u.pitch = 1.08;\n      window.speechSynthesis.speak(u);\n    }catch(e){}\n  }\n\n  /* ---------------- state ---------------- */\n  var state = {\n    key:\"mini\", size:3,\n    sol:{},           // \"r,c\" -> correct letter\n    words:[],         // {w,r,c,dir,clue,emoji,cells:[...],num}\n    entered:{},       // \"r,c\" -> letter\n    revealed:{},      // \"r,c\" -> true\n    sel:null,         // {r,c}\n    dir:\"a\",\n    wordIdx:0,\n    hints:3,\n    solved:false\n  };\n\n  function show(id){\n    Array.prototype.forEach.call(document.querySelectorAll(\".screen\"), function(s){ s.classList.remove(\"active\"); });\n    document.getElementById(id).classList.add(\"active\");\n  }\n\n  function key(r,c){ return r + \",\" + c; }\n\n  function buildPuzzle(which){\n    var P = PUZZLES[which];\n    state.key = which; state.size = P.size;\n    state.sol = {}; state.words = []; state.entered = {}; state.revealed = {};\n    state.sel = null; state.dir = \"a\"; state.wordIdx = 0; state.hints = 3; state.solved = false;\n    bankCache = {}; keysSig = \"\";\n\n    P.words.forEach(function(def){\n      var cells = [];\n      for(var i=0;i<def.w.length;i++){\n        var r = def.r + (def.dir === \"d\" ? i : 0);\n        var c = def.c + (def.dir === \"a\" ? i : 0);\n        var k = key(r,c);\n        if(state.sol[k] && state.sol[k] !== def.w.charAt(i)){\n          console.error(\"Puzzle conflict at\", k, state.sol[k], def.w.charAt(i));\n        }\n        state.sol[k] = def.w.charAt(i);\n        cells.push(k);\n      }\n      state.words.push({\n        w:def.w, r:def.r, c:def.c, dir:def.dir, clue:def.clue, emoji:def.emoji,\n        cells:cells, num:0\n      });\n    });\n\n    // clue numbers: read order, top-to-bottom then left-to-right\n    var starts = state.words.slice().sort(function(a,b){\n      return a.r - b.r || a.c - b.c || (a.dir === \"a\" ? -1 : 1);\n    });\n    var n = 0, used = {};\n    starts.forEach(function(w){\n      var k = key(w.r,w.c);\n      if(!used[k]){ used[k] = ++n; }\n      w.num = used[k];\n    });\n\n    $(\"#puzzleName\").textContent = P.name;\n    document.querySelector(\".play\").classList.toggle(\"mini\", which === \"mini\");\n    paintAll();\n    var first = state.words[0];\n    var fp = first.cells[0].split(\",\");\n    select(+fp[0], +fp[1], first.dir);\n    buildKeys();\n  }\n\n  /* ---------------- board ---------------- */\n  var boardEl = $(\"#board\"), wrapEl = $(\"#boardWrap\");\n\n  function paintAll(){\n    boardEl.innerHTML = \"\";\n    boardEl.style.gridTemplateColumns = \"repeat(\" + state.size + \", var(--cell, 64px))\";\n    boardEl.style.gridTemplateRows = \"repeat(\" + state.size + \", var(--cell, 64px))\";\n\n    for(var r=0;r<state.size;r++){\n      for(var c=0;c<state.size;c++){\n        var k = key(r,c);\n        var d = document.createElement(\"div\");\n        d.className = \"cell\" + (state.sol[k] ? \"\" : \" void\");\n        d.dataset.k = k;\n        d.style.fontSize = \"calc(var(--cell, 64px) * .5)\";\n        if(state.sol[k]){\n          var startWord = state.words.filter(function(w){ return w.cells[0] === k; })[0];\n          if(startWord){\n            var num = document.createElement(\"span\");\n            num.className = \"n\";\n            num.textContent = startWord.num;\n            d.appendChild(num);\n          }\n          var span = document.createElement(\"span\");\n          span.className = \"val\";\n          span.textContent = state.entered[k] || \"\";\n          d.appendChild(span);\n          d.addEventListener(\"click\", (function(rr,cc){ return function(){ onCell(rr,cc); }; })(r,c));\n        }\n        boardEl.appendChild(d);\n      }\n    }\n    sizeBoard();\n    paintSel();\n  }\n\n  function sizeBoard(){\n    var rect = wrapEl.getBoundingClientRect();\n    var pad = 24;\n    var cell = Math.floor(Math.min((rect.width - pad) / state.size, (rect.height - pad) / state.size));\n    cell = Math.max(26, cell);\n    boardEl.style.setProperty(\"--cell\", cell + \"px\");\n  }\n\n  function cellEl(k){\n    return boardEl.querySelector('.cell[data-k=\"' + k + '\"]');\n  }\n\n  function currentWord(){\n    return state.words[state.wordIdx] || state.words[0];\n  }\n\n  function paintSel(){\n    Array.prototype.forEach.call(boardEl.children, function(el){ el.classList.remove(\"hl\",\"sel\"); });\n    var w = currentWord();\n    if(!w) return;\n    w.cells.forEach(function(k){\n      var el = cellEl(k);\n      if(el) el.classList.add(\"hl\");\n    });\n    if(state.sel){\n      var s = cellEl(key(state.sel.r, state.sel.c));\n      if(s) s.classList.add(\"sel\");\n    }\n    $(\"#clueEmoji\").textContent = w.emoji;\n    $(\"#clueNum\").textContent = (w.dir === \"a\" ? \"Across \" : \"Down \") + w.num + \" · \" + w.w.length + \" letters\";\n    $(\"#clueText\").textContent = w.clue;\n  }\n\n  function wordAt(r,c,dir){\n    for(var i=0;i<state.words.length;i++){\n      var w = state.words[i];\n      if(w.dir === dir && w.cells.indexOf(key(r,c)) !== -1) return i;\n    }\n    return -1;\n  }\n\n  function select(r,c,dir){\n    var prevIdx = state.wordIdx;\n    state.sel = { r:r, c:c };\n    var want = dir || state.dir;\n    var idx = wordAt(r,c,want);\n    if(idx === -1){ want = want === \"a\" ? \"d\" : \"a\"; idx = wordAt(r,c,want); }\n    if(idx !== -1){ state.dir = want; state.wordIdx = idx; }\n    paintSel();\n    sizeBoard();\n    buildKeys();\n    if(idx !== -1 && idx !== prevIdx && state.key === \"mini\" && state.words[idx]){\n      speak(state.words[idx].clue);\n    }\n  }\n\n  function onCell(r,c){\n    if(state.solved) return;\n    sTap();\n    var already = state.sel && state.sel.r === r && state.sel.c === c;\n    var hasBoth = wordAt(r,c,\"a\") !== -1 && wordAt(r,c,\"d\") !== -1;\n    var nextDir = already && hasBoth ? (state.dir === \"a\" ? \"d\" : \"a\") : state.dir;\n    select(r,c,nextDir);\n  }\n\n  function advanceWithinWord(){\n    var w = currentWord(); if(!w || !state.sel) return;\n    var i = w.cells.indexOf(key(state.sel.r, state.sel.c));\n    for(var j=i+1;j<w.cells.length;j++){\n      var k = w.cells[j];\n      if(!state.entered[k]){ state.sel = { r:+k.split(\",\")[0], c:+k.split(\",\")[1] }; paintSel(); return; }\n    }\n    if(i+1 < w.cells.length){\n      var nk = w.cells[i+1];\n      state.sel = { r:+nk.split(\",\")[0], c:+nk.split(\",\")[1] };\n    }\n    paintSel();\n  }\n\n  function setCell(k, letter){\n    if(!state.sol[k]) return;\n    state.entered[k] = letter;\n    var el = cellEl(k);\n    if(el){\n      var span = el.querySelector(\".val\");\n      if(span) span.textContent = letter;\n      el.classList.remove(\"wrong\");\n    }\n  }\n\n  function typeLetter(letter){\n    if(state.solved || !state.sel) return;\n    sKey();\n    setCell(key(state.sel.r, state.sel.c), letter);\n    advanceWithinWord();\n    if(isFull()) checkAnswer(true);\n  }\n\n  function backspace(){\n    if(state.solved) return;\n    var w = currentWord(); if(!w || !state.sel) return;\n    var k = key(state.sel.r, state.sel.c);\n    if(state.entered[k]){\n      sTap();\n      state.entered[k] = \"\";\n      var el = cellEl(k);\n      if(el){ var sp = el.querySelector(\".val\"); if(sp) sp.textContent = \"\"; }\n      return;\n    }\n    var i = w.cells.indexOf(k);\n    if(i > 0){\n      var prev = w.cells[i-1];\n      state.sel = { r:+prev.split(\",\")[0], c:+prev.split(\",\")[1] };\n      state.entered[prev] = \"\";\n      var pe = cellEl(prev);\n      if(pe){ var ps = pe.querySelector(\".val\"); if(ps) ps.textContent = \"\"; }\n      paintSel();\n    }\n  }\n\n  function isFull(){\n    var filled = 0, total = 0;\n    for(var k in state.sol){ total++; if(state.entered[k]) filled++; }\n    return filled === total;\n  }\n\n  /* ---------------- keys ---------------- */\n  var keysEl = $(\"#keys\");\n  var bankCache = {}, keysSig = \"\";\n\n  function neededLetters(){\n    var w = currentWord(); if(!w) return \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\".split(\"\");\n    if(state.key === \"mini\"){\n      var set = {};\n      w.w.split(\"\").forEach(function(ch){ set[ch] = 1; });\n      // two gentle distractors that are not in the word\n      var alphabet = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\".split(\"\");\n      var extra = alphabet.filter(function(ch){ return !set[ch]; });\n      for(var i=0;i<2 && extra.length;i++){\n        var ch = extra[Math.floor(Math.random()*extra.length)];\n        set[ch] = 1;\n        extra = extra.filter(function(x){ return x !== ch; });\n      }\n      return shuffle(Object.keys(set));\n    }\n    return \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\".split(\"\");\n  }\n\n  function bankFor(w){\n    var id = state.key + \"|\" + w.w + \"|\" + w.dir;\n    if(!bankCache[id]) bankCache[id] = neededLetters();\n    return bankCache[id];\n  }\n\n  function buildKeys(force){\n    var w = currentWord();\n    if(!w) return;\n    var letters = bankFor(w);\n    var sig = state.key + \"|\" + w.w + \"|\" + w.dir + \"|\" + letters.join(\"\");\n    if(!force && sig === keysSig) return;\n    keysSig = sig;\n\n    keysEl.innerHTML = \"\";\n    letters.forEach(function(ch){\n      var b = document.createElement(\"button\");\n      b.type = \"button\"; b.className = \"key\"; b.textContent = ch;\n      b.addEventListener(\"click\", function(){ typeLetter(ch); });\n      keysEl.appendChild(b);\n    });\n    var del = document.createElement(\"button\");\n    del.type = \"button\"; del.className = \"key del\"; del.textContent = \"⌫ Delete\";\n    del.addEventListener(\"click\", function(){ audio(); backspace(); });\n    keysEl.appendChild(del);\n  }\n\n  function shuffle(a){\n    a = a.slice();\n    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }\n    return a;\n  }\n\n  /* ---------------- actions ---------------- */\n  function checkAnswer(silent){\n    if(state.solved) return;\n    var wrong = [], empty = 0;\n    for(var k in state.sol){\n      if(!state.entered[k]){ empty++; continue; }\n      if(state.entered[k] !== state.sol[k]) wrong.push(k);\n    }\n    if(wrong.length === 0 && empty === 0){ win(); return; }\n\n    wrong.forEach(function(k){\n      var el = cellEl(k);\n      if(el){ el.classList.add(\"wrong\"); }\n    });\n    if(!silent){\n      if(wrong.length){ sWrong(); }\n      else if(empty){ tone(440,.1,\"triangle\",.07,0); }\n    }\n    if(wrong.length){\n      setTimeout(function(){\n        wrong.forEach(function(k){\n          var el = cellEl(k);\n          if(el) el.classList.remove(\"wrong\");\n        });\n      }, 1200);\n    }\n    // jump to the first empty square so the child can keep going\n    if(empty){\n      var firstEmpty = null;\n      state.words.forEach(function(w){\n        w.cells.forEach(function(k){ if(!firstEmpty && !state.entered[k]) firstEmpty = k; });\n      });\n      if(firstEmpty){\n        var p = firstEmpty.split(\",\");\n        var wIdx = state.words.filter(function(w){ return w.cells.indexOf(firstEmpty) !== -1; })[0];\n        select(+p[0], +p[1], wIdx ? wIdx.dir : state.dir);\n      }\n    }\n  }\n\n  function hint(){\n    if(state.solved) return;\n    if(state.hints <= 0){ tone(200,.12,\"triangle\",.08,0); return; }\n    var k = state.sel ? key(state.sel.r, state.sel.c) : null;\n    if(!k || (state.entered[k] === state.sol[k])){\n      // pick the first square that is empty or wrong\n      var pickK = null;\n      var w = currentWord();\n      var order = w.cells.concat(Object.keys(state.sol));\n      for(var i=0;i<order.length && !pickK;i++){\n        var kk = order[i];\n        if(state.sol[kk] && state.entered[kk] !== state.sol[kk]) pickK = kk;\n      }\n      if(!pickK) return;\n      k = pickK;\n      var p = k.split(\",\");\n      state.sel = { r:+p[0], c:+p[1] };\n      paintSel();\n    }\n    state.hints--;\n    state.entered[k] = state.sol[k];\n    state.revealed[k] = true;\n    var el = cellEl(k);\n    if(el){\n      el.classList.remove(\"wrong\");\n      el.classList.add(\"reveal\");\n      var sp = el.querySelector(\".val\");\n      if(sp) sp.textContent = state.sol[k];\n    }\n    $(\"#hintPill\").innerHTML = \"💡 <b>\" + state.hints + \"<\/b>\";\n    tone(880,.1,\"sine\",.1,0);\n    paintSel();\n    if(isFull()) checkAnswer(true);\n  }\n\n  function clearAll(){\n    if(state.solved) return;\n    for(var k in state.entered){\n      if(state.revealed[k]) continue;\n      state.entered[k] = \"\";\n      var el = cellEl(k);\n      if(el){ var sp = el.querySelector(\".val\"); if(sp) sp.textContent = \"\"; el.classList.remove(\"wrong\",\"reveal\"); }\n    }\n    sTap();\n  }\n\n  /* ---------------- win ---------------- */\n  function win(){\n    state.solved = true;\n    var stars = state.hints >= 3 ? 3 : state.hints === 2 ? 2 : 1;\n    var bestKey = state.key === \"mini\" ? \"kg.best.word.mini\" : \"kg.best.word.big\";\n    var prev = parseInt(store.get(bestKey) || \"0\", 10) || 0;\n    if(stars > prev) store.set(bestKey, String(stars));\n    var all = Math.max(prev, stars);\n    store.set(\"kg.best.word\", String(all));\n    toShell({ kg:\"best\", game:\"word\", stars:stars });\n\n    $(\"#bigStars\").innerHTML = [0,1,2].map(function(i){\n      return '<span class=\"' + (i < stars ? \"\" : \"off\") + '\">★<\/span>';\n    }).join(\"\");\n    $(\"#medal\").textContent = state.key === \"mini\" ? \"🌻\" : \"🌳\";\n    $(\"#resultLine\").innerHTML = \"Every word is filled! \" +\n      (state.hints === 3 ? \"No hints needed.\" : state.hints + \" hint\" + (state.hints === 1 ? \"\" : \"s\") + \" used.\");\n    sWin(); confetti();\n    setTimeout(function(){ show(\"done\"); }, 900);\n  }\n\n  /* ---------------- confetti ---------------- */\n  var cv = $(\"#fx\"), cx = cv.getContext(\"2d\"), parts = [], raf = 0;\n  function sizeCanvas(){\n    var dpr = Math.min(window.devicePixelRatio || 1, 2);\n    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;\n    cv.style.width = innerWidth + \"px\"; cv.style.height = innerHeight + \"px\";\n    cx.setTransform(dpr,0,0,dpr,0,0);\n  }\n  sizeCanvas(); addEventListener(\"resize\", sizeCanvas);\n  function confetti(){\n    var colors = [\"#3DDC84\",\"#FF8FB1\",\"#FFD24A\",\"#FFFDF3\",\"#8FB4FF\"];\n    parts = [];\n    for(var i=0;i<100;i++){\n      parts.push({\n        x: innerWidth/2 + (Math.random()-.5)*innerWidth*.5,\n        y: innerHeight*.45 + (Math.random()-.5)*60,\n        vx:(Math.random()-.5)*9, vy:-6-Math.random()*9,\n        s:5+Math.random()*8, c:colors[i%colors.length],\n        r:Math.random()*6, vr:(Math.random()-.5)*.3, life:1\n      });\n    }\n    if(!raf) tick();\n  }\n  function tick(){\n    cx.clearRect(0,0,innerWidth,innerHeight);\n    var alive = 0;\n    for(var i=0;i<parts.length;i++){\n      var p = parts[i];\n      p.vy += .32; p.vx *= .995; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;\n      if(p.life <= 0 || p.y > innerHeight + 40) continue;\n      alive++;\n      cx.save();\n      cx.globalAlpha = Math.max(0, Math.min(1, p.life*1.6));\n      cx.translate(p.x,p.y); cx.rotate(p.r);\n      cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);\n      cx.restore();\n    }\n    if(alive){ raf = requestAnimationFrame(tick); }\n    else { raf = 0; cx.clearRect(0,0,innerWidth,innerHeight); }\n  }\n\n  /* ---------------- wiring ---------------- */\n  function start(which){\n    show(\"game\");\n    buildPuzzle(which);\n    $(\"#hintPill\").innerHTML = \"💡 <b>3<\/b>\";\n    requestAnimationFrame(function(){ sizeBoard(); buildKeys(); paintSel(); });\n  }\n\n  Array.prototype.forEach.call(document.querySelectorAll(\".level\"), function(b){\n    b.addEventListener(\"click\", function(){ audio(); sTap(); start(b.dataset.level); });\n  });\n  $(\"#back\").addEventListener(\"click\", function(){ sTap(); show(\"home\"); });\n  $(\"#checkBtn\").addEventListener(\"click\", function(){ audio(); checkAnswer(false); });\n  $(\"#clearBtn\").addEventListener(\"click\", function(){ audio(); clearAll(); });\n  $(\"#hintPill\").addEventListener(\"click\", function(){ audio(); hint(); });\n  $(\"#clueSpeak\").addEventListener(\"click\", function(){\n    audio();\n    var w = currentWord();\n    if(w) speak(w.clue);\n  });\n  $(\"#again\").addEventListener(\"click\", function(){ sTap(); start(state.key); });\n  $(\"#change\").addEventListener(\"click\", function(){ sTap(); show(\"home\"); });\n  $(\"#allGames\").addEventListener(\"click\", function(){\n    sTap();\n    if(embedded){ toShell({kg:\"home\"}); } else { location.href = \"index.html\"; }\n  });\n\n\n  addEventListener(\"resize\", function(){\n    if($(\"#game\").classList.contains(\"active\")) sizeBoard();\n  });\n  addEventListener(\"orientationchange\", function(){\n    setTimeout(function(){ if($(\"#game\").classList.contains(\"active\")) sizeBoard(); }, 120);\n  });\n\n  addEventListener(\"keydown\", function(e){\n    if(!$(\"#game\").classList.contains(\"active\") || state.solved) return;\n    if(/^[a-zA-Z]$/.test(e.key)){ typeLetter(e.key.toUpperCase()); e.preventDefault(); }\n    else if(e.key === \"Backspace\"){ backspace(); e.preventDefault(); }\n    else if(e.key === \"ArrowRight\" || e.key === \"ArrowLeft\" || e.key === \"ArrowUp\" || e.key === \"ArrowDown\"){\n      if(!state.sel) return;\n      var dr = e.key === \"ArrowDown\" ? 1 : e.key === \"ArrowUp\" ? -1 : 0;\n      var dc = e.key === \"ArrowRight\" ? 1 : e.key === \"ArrowLeft\" ? -1 : 0;\n      var r = state.sel.r + dr, c = state.sel.c + dc;\n      if(r>=0 && r<state.size && c>=0 && c<state.size && state.sol[key(r,c)]) select(r,c);\n      e.preventDefault();\n    }\n    else if(e.key === \"Tab\"){\n      e.preventDefault();\n      var i = (state.wordIdx + 1) % state.words.length;\n      var w = state.words[i];\n      select(+w.cells[0].split(\",\")[0], +w.cells[0].split(\",\")[1], w.dir);\n    }\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"};

var stage = document.getElementById("stage"),
    frame = document.getElementById("frame");

var store = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

function paintStars(){
  Array.prototype.forEach.call(document.querySelectorAll("[data-stars]"), function(el){
    var n = parseInt(store.get("kg.best." + el.dataset.stars) || "0", 10) || 0;
    el.innerHTML = [0,1,2].map(function(i){
      return '<span class="' + (i < n ? "" : "off") + '">\u2605</span>';
    }).join("");
  });
}

function openGame(key){
  if(!GAMES[key]) return;
  frame.setAttribute("srcdoc", GAMES[key]);
  stage.classList.add("on");
}

function goHome(){
  stage.classList.remove("on");
  frame.removeAttribute("srcdoc");
  paintStars();
}

Array.prototype.forEach.call(document.querySelectorAll(".game"), function(btn){
  btn.addEventListener("click", function(){ openGame(btn.dataset.game); });
});

addEventListener("message", function(e){
  var d = e.data || {};
  if(!d || !d.kg) return;
  if(d.kg === "home"){ goHome(); return; }
  if(d.kg === "best" && d.game){
    var k = "kg.best." + d.game;
    var prev = parseInt(store.get(k) || "0", 10) || 0;
    if(d.stars > prev) store.set(k, String(d.stars));
    paintStars();
  }
});

paintStars();
</script>
